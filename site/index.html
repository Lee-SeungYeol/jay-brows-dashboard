<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jay Brows 대시보드</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e3de;--ig:#d62976;--fb:#1877f2;--warn:#b45309;--warnbg:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--text:#f2f2f2;--muted:#9a9a9f;--line:#2e2e2e;--warn:#fbbf24;--warnbg:#3a2e10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h1{font-size:22px;margin:0}
.muted{color:var(--muted);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.grid+.grid{margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.stat{position:relative}
.stat .delta{font-style:normal;font-size:12.5px;white-space:nowrap;font-weight:600;margin-left:6px;color:var(--muted)}
.stat .delta.up{color:#16a34a}.stat .delta.down{color:#dc2626}
.stat b{display:inline}
.stat span{display:block;margin-top:4px}
.stat .q,.chcard .q{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--muted);font-size:10px;margin-left:3px}
.stat .tip,.chcard .tip{display:none;position:absolute;left:8px;right:8px;top:calc(100% + 6px);z-index:5;background:var(--text);color:var(--bg);padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.stat .tip small,.chcard .tip small{opacity:.75}
.has-tip{cursor:help}
@media (hover:hover){.has-tip:hover .tip{display:block}}
.has-tip.show .tip{display:block}
h2{font-size:17px;margin:28px 0 10px}
.warn{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:12px 14px;margin-top:16px;font-size:14px}
.warn ul{margin:6px 0 0;padding-left:18px}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.post{display:flex;flex-direction:column;overflow:hidden;padding:0}
.post img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--line)}
.post .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.post p{margin:0;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nums{display:flex;gap:12px;font-size:13px;color:var(--muted)}
.post a{color:var(--accent);font-size:13px;text-decoration:none}
details{font-size:13px}
summary{cursor:pointer;color:var(--muted)}
.cmt{border-top:1px solid var(--line);padding:6px 0}
.cmt b{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
td.u{font-weight:600;white-space:nowrap}
td.t{color:var(--muted);white-space:nowrap;font-size:12px}
.empty{color:var(--muted);padding:30px;text-align:center}
.c{padding:6px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.c.r{margin-left:16px;padding-left:8px;border-left:2px solid var(--line);border-top:0}
.c b{font-weight:600}
.c small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
td{overflow-wrap:anywhere}
@media (max-width:600px){td.u,td.t{white-space:normal}td.u{max-width:34vw}}
.chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.chcard{min-width:0;padding:12px 10px 8px}
.chcard h3{font-size:14.5px;margin:2px 4px 2px;position:relative}
.chcard h3 .tip{font-weight:400;left:0;right:auto;width:min(320px,80vw)}
.chcard:last-child:nth-child(odd){grid-column:1/-1}
.fchart .pt.note{fill:var(--text)}
.fchart .nt{fill:var(--muted);font-size:10px;font-weight:600}
.chsum{font-size:12.5px;color:var(--muted);margin:0 4px 4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.chsum b{color:var(--text);font-weight:600}
.chsum .up{color:#16a34a}.chsum .dn{color:#dc2626}
.fchart{position:relative;padding-top:4px}
.fchart svg{display:block;width:100%;height:auto;overflow:visible}
.fchart .ax{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.fchart .gl{stroke:var(--line);stroke-width:1}
.fchart .zl{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3;opacity:.8}
.fchart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.fchart .ar{stroke:none}
.fchart .ag0{stop-color:var(--accent);stop-opacity:.25}
.fchart .ag1{stop-color:var(--accent);stop-opacity:0}
@media (prefers-color-scheme:dark){.fchart .ag0{stop-opacity:.32}}
.fchart .pt{fill:var(--accent);stroke:none}
.fchart .pt.gap{fill:var(--card);stroke:var(--accent);stroke-width:2}
.fchart .sel{fill:var(--accent);stroke:var(--card);stroke-width:2}
.fchart .sel.gap{fill:var(--card);stroke:var(--accent)}
.fchart .hit{fill:transparent;cursor:pointer}
.fchart .vl{stroke:var(--accent);stroke-width:1;opacity:.35}
.fchart .ctip{--up:#4ade80;--dn:#f87171;position:absolute;top:4px;z-index:4;pointer-events:none;background:var(--text);color:var(--bg);padding:7px 10px;border-radius:9px;font-size:12.5px;line-height:1.45;width:max-content;max-width:min(290px,100%);box-shadow:0 6px 20px rgba(0,0,0,.2);font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){.fchart .ctip{--up:#15803d;--dn:#b91c1c}}
.fchart .ctip small{opacity:.75}
.fchart .ctip .up{color:var(--up)}.fchart .ctip .dn{color:var(--dn)}.fchart .ctip .zz{opacity:.7}
.fchart .msg{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.more{display:block;margin:16px auto 0;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 22px;border-radius:999px;cursor:pointer}
/* 댓글 스레드 + 모달 */
.cf{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.cf button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.cf button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.thr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 6px;border-top:1px solid var(--line);cursor:pointer;overflow-wrap:anywhere;border-radius:6px}
.thr:first-child{border-top:0}
.thr:hover,.thr:focus-visible{background:color-mix(in srgb,var(--text) 5%,transparent);outline:none}
.thr .hd{font-size:14px;min-width:0}
.thr .hd b{font-weight:600;margin-right:6px}
.thr .tt{color:var(--muted);font-size:12px;white-space:nowrap;text-align:right}
.thr .tx{grid-column:1/-1;font-size:14px}
.thr .pc{grid-column:1/-1;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb{display:inline-block;font-size:11px;font-weight:600;line-height:1;padding:4px 7px;border-radius:999px;vertical-align:1px;white-space:nowrap;margin-right:4px}
.rb.ok{background:#dcfce7;color:#15803d}
.rb.n{background:var(--line);color:var(--muted)}
@media (prefers-color-scheme:dark){.rb.ok{background:#14532d;color:#86efac}}
.c.th{cursor:pointer}
.c.th:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}
#cm{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
#cm.on{display:flex}
#cm .sh{background:var(--card);color:var(--text);border-radius:16px;width:min(520px,100%);max-height:min(86vh,760px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#cm .top{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
#cm .top img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--line);flex:none}
#cm .top .cp{flex:1;min-width:0;font-size:13px}
#cm .top .cp p{margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
#cm .top a{color:var(--accent);text-decoration:none;font-size:12.5px}
#cm .x{flex:none;border:0;background:none;color:var(--text);font-size:20px;line-height:1;width:36px;height:36px;border-radius:50%;cursor:pointer}
#cm .x:hover{background:var(--line)}
#cm .bd{overflow-y:auto;padding:6px 14px 16px;overscroll-behavior:contain}
.ic{display:flex;gap:10px;padding:10px 0}
.ic.rp{margin-left:42px;padding:6px 0}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
.ic.rp .av{width:26px;height:26px;font-size:11px}
.ic .m{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.ic .m b{font-weight:600;margin-right:5px}
.ic .m small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.ic.me .m{background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:10px;padding:6px 9px}
.atag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--accent);color:#fff;margin-right:5px;vertical-align:1px}
@media (max-width:600px){#cm{padding:0;align-items:flex-end}#cm .sh{width:100%;max-height:none;height:94vh;border-radius:16px 16px 0 0}}
body.lock{overflow:hidden}
/* 대시보드에서 바로 답글 */
.rpx{border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;flex-direction:column;gap:7px;font-size:13px}
.rpx .rh{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted)}
.rpx .rh b{color:var(--text)}
.rpx textarea,.rpx input{width:100%;font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.rpx textarea{resize:vertical;min-height:60px;max-height:30vh}
.rpx .rr{display:flex;gap:8px;align-items:center}
.rpx .rr input{flex:1}
.rpx button.go{border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:9px 14px;cursor:pointer;white-space:nowrap}
.rpx button.go:disabled{opacity:.5;cursor:default}
.rpx .lk{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
.rpx .st{min-height:1em;font-size:12.5px}
.rpx .st.ok{color:#16a34a}.rpx .st.err{color:#dc2626}
.rpx.off{color:var(--muted);text-align:center}
.rpt{border:0;background:none;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;padding:0 0 0 6px}
.ic.tg .m{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:10px;outline-offset:2px}
.sent{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--line);color:var(--muted);margin-left:5px}
/* 최근 1시간 조회수 급상승 TOP 10 */
.tgh{position:relative}
.tgh .q{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--muted);font-size:10px;margin-left:3px;vertical-align:2px;font-weight:400}
.tgh .tip{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:5;width:min(340px,calc(100vw - 32px));background:var(--text);color:var(--bg);padding:10px 12px;border-radius:10px;font-size:12.5px;font-weight:400;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.tgh .tip small{opacity:.75}
.tg{padding:6px 10px}
.tg .sub{font-size:12px;color:var(--muted);margin:4px 2px 6px;overflow-wrap:anywhere}
.tgr{display:grid;grid-template-columns:18px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 2px;border-top:1px solid var(--line);color:var(--text);text-decoration:none;border-radius:6px}
.tg .sub+.tgr{border-top:0}
.tgr:hover,.tgr:focus-visible{background:color-mix(in srgb,var(--text) 5%,transparent);outline:none}
.tgr .rk{font-weight:700;font-size:14px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.tgr img,.tgr .ph{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--line);display:block}
.tgr .mn{min-width:0;display:flex;flex-direction:column;gap:5px}
.tgr .l1{display:flex;gap:6px;align-items:center;min-width:0;font-size:13px}
.tgr .l1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tgr .tb{flex:none;font-size:10.5px;font-weight:600;line-height:1;padding:4px 6px;border-radius:999px;background:var(--line);color:var(--text)}
.tgr .l2{display:flex;gap:8px;align-items:center;min-width:0}
.tgr .bt{flex:1 1 auto;min-width:40px;height:8px;border-radius:999px;background:color-mix(in srgb,var(--text) 7%,transparent);overflow:hidden}
.tgr .bt,.tgr .bf{display:block}.tgr .bf{height:100%;border-radius:999px;background:var(--accent,var(--ig));min-width:3px}
.tgr .lb{flex:none;min-width:10.8em;text-align:right;font-size:12px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.tgr .lb small{color:var(--muted);font-weight:500;font-size:11.5px}
.lv{font-size:11px;font-weight:700;line-height:1;padding:5px 8px;border-radius:999px;white-space:nowrap}
.lv.s{background:#dcfce7;color:#15803d}.lv.m{background:#fef3c7;color:#b45309}.lv.w{background:var(--line);color:var(--muted)}
@media (prefers-color-scheme:dark){.lv.s{background:#14532d;color:#86efac}.lv.m{background:#422c06;color:#fcd34d}}
.tgr .lvw{display:flex;align-items:center;gap:6px;white-space:nowrap}.tgr .rx{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:420px){.tgr .lvw{flex-direction:column;align-items:flex-end;gap:3px}.tgr{grid-template-columns:16px 36px minmax(0,1fr) auto;gap:8px}.tgr img,.tgr .ph{width:36px;height:36px}}
/* 댓글 많이 단 계정 TOP 10 */
.tcr{cursor:pointer;grid-template-columns:18px 40px minmax(0,1fr)}
.tcr .lb{min-width:0}.tcr .l3 .lv{font-size:10.5px;padding:4px 7px}
.tcr .tca{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
.tcr .l1 .rt{flex:none;color:var(--muted);font-size:11.5px}
.tcr .l1 b.u{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcr.on{background:color-mix(in srgb,var(--text) 5%,transparent)}
.tcl{margin:0 2px 8px 30px;padding:2px 0 4px;border-left:2px solid var(--line)}
.tcl .tci{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--text);text-decoration:none;font-size:13px}
.tcl .tci:hover,.tcl .tci:focus-visible{background:color-mix(in srgb,var(--text) 5%,transparent);outline:none}
.tcl .tci img,.tcl .tci .ph{width:28px;height:28px;border-radius:5px;object-fit:cover;background:var(--line);display:block}
.tcl .tci .tx{overflow-wrap:anywhere}.tcl .tci small{display:block;color:var(--muted);font-size:11.5px}
.tcl .tcm{font-size:12px;color:var(--muted);padding:4px 8px}
@media (max-width:420px){.tcr{grid-template-columns:16px 36px minmax(0,1fr)}.tcr .tca{width:36px;height:36px;font-size:15px}.tcl{margin-left:12px}}
/* 급상승 TOP 3 조회수 추이 */
:root{--s1:#d62976;--s2:#2563eb;--s3:#d97706}
@media (prefers-color-scheme:dark){:root{--s1:#f472b6;--s2:#60a5fa;--s3:#fbbf24}}
.t3{padding:10px 10px 8px}
.t3 .lg3{display:flex;flex-direction:column;gap:4px;margin:0 2px 6px}
.t3 .li{display:grid;grid-template-columns:10px 22px minmax(0,1fr) auto;gap:7px;align-items:center;font-size:12.5px;color:var(--text);text-decoration:none;min-width:0}
.t3 .li i{width:10px;height:3px;border-radius:2px;display:block}
.t3 .li img,.t3 .li .ph{width:22px;height:22px;border-radius:5px;object-fit:cover;background:var(--line);display:block}
.t3 .li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.t3 .li b small{font-weight:600;font-size:11px;color:#16a34a}.t3 .li b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.t3c .ln.s1,.t3c .pt.s1,.t3c .sel.s1{stroke:var(--s1)}.t3c .ln.s2,.t3c .sel.s2{stroke:var(--s2)}.t3c .ln.s3,.t3c .sel.s3{stroke:var(--s3)}
.t3c .sel.s1{fill:var(--s1)}.t3c .sel.s2{fill:var(--s2)}.t3c .sel.s3{fill:var(--s3)}
.t3c .vl{stroke:var(--text)}
.t3c .ctip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
/* 시간대별 평균 조회수 */
.hv{padding:10px 12px 8px}
.hv .sub{font-size:12px;color:var(--muted);margin:0 0 8px;min-height:18px;font-variant-numeric:tabular-nums}
.hv .sub b{color:var(--text)}
.hvb{display:flex;align-items:flex-end;gap:2px;height:96px;border-bottom:1px solid var(--line)}
.hvb .hc{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:flex-end;position:relative;cursor:pointer;border-radius:3px 3px 0 0}
.hvb .hc:hover,.hvb .hc.sel{background:color-mix(in srgb,var(--text) 6%,transparent)}
.hvb .hc i{display:block;width:100%;border-radius:3px 3px 0 0;background:color-mix(in srgb,var(--ig) 45%,transparent)}
.hvb .hc.top i{background:color-mix(in srgb,var(--ig) 75%,transparent)}
.hvb .hc.best i{background:#2563eb}
.hvx{display:flex;gap:2px;margin-top:3px}
.hvx span{flex:1 1 0;min-width:0;text-align:left;white-space:nowrap;overflow:visible;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.hv .lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}
.hv .lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--ig)}
.hv .lg i.b{background:#2563eb}
@media (prefers-color-scheme:dark){.hvb .hc.best i,.hv .lg i.b{background:#60a5fa}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Jay Brows 대시보드</h1>
    <span class="muted" id="updated"></span>
  </header>
  <div class="tabs">
    <button data-k="instagram" class="on">인스타그램</button>
    <button data-k="facebook">페이스북</button>
  </div>
  <div id="errors"></div>
  <div id="view"></div>
</main>
<div id="cm" role="dialog" aria-modal="true" aria-label="댓글 스레드"><div class="sh"><div class="top" id="cmtop"></div><div class="bd" id="cmbd"></div><div class="rpx" id="cmrp" hidden></div></div></div>
<script>

  if (avgB) avgB.fmt = a => a < 1 ? a.toFixed(2) : (Math.round(a * 10) / 10).toLocaleString("ko-KR");
  let h = (isIG ? `<div class="grid">` +
      stat("오늘 도달", t.reach, "오늘 내 콘텐츠나 프로필을 한 번이라도 본 계정 수예요. 한 사람이 여러 번 봐도 1명으로 세요.", B("reach", true), "reach", yd("reach")) +
      stat("오늘 조회", t.views, "오늘 콘텐츠가 화면에 표시되거나 재생된 총 횟수예요. 같은 사람이 여러 번 보면 모두 셉니다.", B("views", true), "views", yd("views")) +
      stat("오늘 프로필 방문", t.profile_views, "오늘 내 프로필 페이지를 연 횟수예요.", B("profile_views", true), "profile_views", yd("profile_views")) +
      stat("오늘 반응 계정", t.accounts_engaged, "오늘 좋아요·댓글·저장·공유·답장 등으로 반응한 계정 수예요(중복 제외).", B("accounts_engaged", true), "accounts_engaged", yd("accounts_engaged")) +
      `</div>` : "") +
    `<div class="grid">` +
    (isIG
      ? stat("팔로워", d.followers, "나를 팔로우하는 계정 수예요.", B("followers"), "followers") +
        stat("전체 좋아요", T.likes, `지금까지 올린 모든 게시물·릴스${tp ? ` ${num(tp)}개` : ""}가 받은 좋아요 합계예요.`, B("likes"), "likes") +
        stat("전체 댓글", T.comments, `모든 게시물·릴스${tp ? ` ${num(tp)}개` : ""}에 달린 댓글 합계(답글 포함)예요.`, B("comments"), "comments") +
        stat("전체 공유", T.shares, "모든 게시물·릴스가 DM·스토리 등으로 공유된 횟수 합계예요.", B("shares"), "shares", covNote) +
        stat("전체 저장", T.saves, "모든 게시물·릴스를 사람들이 저장(북마크)한 횟수 합계예요.", B("saves"), "saves", covNote) +
        stat("게시물당 평균 반응", T.avg_reaction, `${AVG_TIP}<br>평균 좋아요 ${r1(aL)} · 댓글 ${r1(aC)} · 공유 ${r1(aS)} · 저장 ${r1(aV)}`,
          avgB, "avg_reaction", covNote, r1)
      : stat("팔로워", d.followers) + stat("페이지 좋아요", d.fans) +
        stat(`최근 ${posts.length}개 좋아요`, likes) + stat(`최근 ${posts.length}개 댓글`, cmts) +
        stat("게시물당 평균 반응", posts.length ? Math.round((likes + cmts) / posts.length) : null)) +
    `</div>`;
  if (isIG) h += `<h2>반응 흐름</h2>` +
    `<div class="chgrid">${CHARTS.map(c => `<div class="card chcard"><h3${c.tip ? ` class="has-tip" tabindex="0"` : ""}>${c.title}${c.tip ? ` <i class="q">?</i><div class="tip">${c.tip}</div>` : ""}</h3><div class="chsum" id="${c.id}-sum"></div><div class="fchart" id="${c.id}"></div></div>`).join("")}</div>`;

  indexThreads();
  h += `<h2>최근 댓글</h2><div class="cf" id="cfbar" role="group" aria-label="댓글 필터"></div><div class="card" id="thlist"></div>`;
  if (isIG) h += topGrowthHTML(d) + top3HTML(d) + `<div id="tcbox">${topCmHTML(d)}</div>`;
  if (isIG) h += hourlyHTML(d);

  if (!isIG) h += `<h2>게시물</h2><div class="posts">` + posts.map(p => card(p)).join("") + `</div>`;
  v.innerHTML = h;
  thList();
  if (openTh) showTh(openTh);
  if (isIG) drawCharts();
}

/* ---------- 최근 1시간 조회수 급상승 TOP 10 (instagram.top_growth: 최근 60분 동안의 조회수 증가량) ---------- */
const LV = {"강함": "s", "보통": "m", "약함": "w"};
const TG_TIP = "순위 = 최근 1시간 동안 늘어난 조회수 순(3분마다 다시 계산).<br>강함 = 1시간에 조회수 100 이상 증가 · 보통 = 50~99 · 약함 = 50 미만.<br><small>(1시간이 안 쌓였으면 지금까지 속도를 1시간 기준으로 환산)</small>";
function topGrowthHTML(d) {
  const rows = d.top_growth || [], m = d.top_growth_meta || {};
  const wm = m.window_min != null ? Math.round(m.window_min) : null;
  const win = wm != null && wm < 55 ? `최근 ${num(wm)}분` : "최근 1시간";
  const tag = wm != null && wm < 55 ? `${num(wm)}분` : "1시간";
  const head = `<h2 class="tgh has-tip" tabindex="0">${win} 조회수 급상승 TOP 10 <i class="q">?</i><div class="tip">${TG_TIP}</div></h2>`;
  const since = m.since ? `${fullT(Date.parse(m.since))}부터 지금까지` : "";
  if (!rows.length) return head + `<div class="card empty">${win} 동안 조회수가 늘어난 게시물이 없어요${since ? `<br><small>${since} 기준</small>` : ""}</div>`;
  const max = Math.max(...rows.map(r => r.dv), 1);
  const pct = r => r.rate == null ? "" : ` <small>(+${(Math.round(r.rate * 10) / 10).toLocaleString("ko-KR", {minimumFractionDigits: 1, maximumFractionDigits: 1})}%)</small>`;
  return head + `<div class="card tg"><div class="sub">${since ? `${since} · ` : ""}조회수가 늘어난 게시물 ${num(m.posts_with_growth)}개${m.median_dv != null ? ` · 중앙값 +${num(m.median_dv)}` : ""}</div>` +
    rows.map((r, i) => `<a class="tgr" href="${esc(r.url)}" target="_blank" rel="noopener" title="${esc(r.text)}">
      <span class="rk">${i + 1}</span>
      ${r.image ? `<img loading="lazy" src="${esc(r.image)}" alt="" onerror="this.style.visibility='hidden'">` : `<span class="ph"></span>`}
      <span class="mn"><span class="l1"><b class="tb">${r.kind === "REELS" ? "릴스" : "게시물"}</b><span>${esc(r.text) || "(내용 없음)"}</span></span>
        <span class="l2"><span class="bt"><span class="bf" style="width:${(r.dv / max * 100).toFixed(1)}%"></span></span><span class="lb">+${num(r.dv)} 조회${pct(r)} · ${tag}</span></span></span>
      <span class="lvw">${r.per_hour != null ? `<small class="rx">시간당 +${num(Math.round(r.per_hour))} 조회</small>` : ""}<span class="lv ${LV[r.level] || "w"}">${esc(r.level)}</span></span></a>`).join("") + `</div>`;
}

/* ---------- 급상승 TOP 3 조회수 추이 (instagram.top3_series: 시간별 기록 + 3분 스냅샷 + 현재값) ---------- */
const T3C = ["s1", "s2", "s3"];
// y = 증가량: 각 게시물의 첫 점 대비 늘어난 조회수 (v), 실제 누적 조회수는 tot
const t3Series = d => (d.top3_series || []).map((s, i) => {
  const raw = (s.points || []).map(([t, v]) => ({ts: Date.parse(t), tot: v})).filter(p => isFinite(p.ts) && p.tot != null).sort((a, b) => a.ts - b.ts);
  const b0 = raw.length ? raw[0].tot : 0;
  return {...s, c: T3C[i], pts: raw.map(p => ({...p, v: p.tot - b0}))};
});
function top3HTML(d) {
  const S = t3Series(d);
  const head = `<h2>급상승 TOP 3 조회수 추이</h2>`;
  if (!S.length || Math.max(...S.map(s => s.pts.length)) < 2) return head + `<div class="card t3"><div class="fchart t3c"><div class="msg">조회수 기록이 쌓이는 중이에요</div></div></div>`;
  return head + `<div class="card t3"><div class="lg3">` + S.map(s => {
    const lp = s.pts[s.pts.length - 1];
    return `<a class="li" href="${esc(s.url || "#")}" target="_blank" rel="noopener" title="${esc(s.text)}"><i style="background:var(--${s.c})"></i>${s.image ? `<img loading="lazy" src="${esc(s.image)}" alt="" onerror="this.style.visibility='hidden'">` : `<span class="ph"></span>`}<span>${esc(s.text) || (s.kind === "REELS" ? "(릴스)" : "(내용 없음)")}</span><b>${lp ? `${num(lp.tot)} <small class="up">${sgn(lp.v)}</small>` : "–"}</b></a>`;
  }).join("") + `</div><div class="fchart t3c" id="t3chart"></div></div>`;
}
function drawTop3() {
  const box = document.getElementById("t3chart");
  if (!box || !data || !data.instagram) return;
  const S = t3Series(data.instagram).filter(s => s.pts.length);
  const all = [...new Set(S.flatMap(s => s.pts.map(p => p.ts)))].sort((a, b) => a - b);
  if (all.length < 2) { box.innerHTML = `<div class="msg">조회수 기록이 쌓이는 중이에요</div>`; box._geo = null; return; }
  const W = Math.max(260, box.clientWidth), H = W < 480 ? 150 : 170;
  const L = 54, R = 10, TP = 8, B = 30, pw = W - L - R, ph = H - TP - B;
  const t0 = all[0], t1 = all[all.length - 1], span = Math.max(1, t1 - t0);
  const vals = S.flatMap(s => s.pts.map(p => p.v));
  let lo = Math.min(0, ...vals), hi = Math.max(...vals);
  if (hi - lo < 2) hi = lo + 2;
  const raw = (hi - lo) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = Math.max(1, [1, 2, 5, 10].map(m => m * mag).find(st => st >= raw));
  const k0 = Math.floor(lo / step + 1e-9), k1 = Math.ceil(hi / step - 1e-9);
  lo = k0 * step; hi = k1 * step;
  const X = ts => L + (ts - t0) / span * pw, Y = v => TP + (hi - v) / (hi - lo) * ph;
  let g = "";
  for (let k = k0; k <= k1; k++) {
    const v = k * step;
    g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v > 0 ? "+" : ""}${num(v)}</text>`;
  }
  const maxLab = Math.max(2, Math.floor(pw / 70));
  const steps = [3, 5, 10, 15, 30, 60, 120, 180, 360, 720, 1440].map(m => m * 6e4);
  const every = steps.find(st => span / st <= maxLab) || steps[steps.length - 1], off = 9 * 36e5;
  for (let ts = Math.ceil((t0 + off) / every) * every - off; ts <= t1; ts += every) {
    const k = kst(ts);
    g += `<text class="ax" x="${X(ts).toFixed(1)}" y="${H - 16}" text-anchor="middle">${p2(k.h)}:${p2(k.m)}</text><text class="ax" x="${X(ts).toFixed(1)}" y="${H - 3}" text-anchor="middle">${k.mo}/${k.d}</text>`;
  }
  const lines = S.map(s => `<path class="ln ${s.c}" d="${s.pts.map((p, i) => `${i ? "L" : "M"}${X(p.ts).toFixed(1)},${Y(p.v).toFixed(1)}`).join("")}"/>`).join("");
  let hits = "";
  all.forEach((ts, i) => {
    const x = X(ts), xl = i ? (x + X(all[i - 1])) / 2 : L, xr = i < all.length - 1 ? (x + X(all[i + 1])) / 2 : W - R;
    hits += `<rect class="hit" data-ti="${i}" x="${xl.toFixed(1)}" y="${TP}" width="${Math.max(1, xr - xl).toFixed(1)}" height="${ph}"/>`;
  });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="급상승 TOP 3 조회수 증가 추이">${g}<line class="vl" x1="0" x2="0" y1="${TP}" y2="${TP + ph}" style="display:none"/>${lines}${S.map(s => `<circle class="sel ${s.c}" r="4" style="display:none"/>`).join("")}${hits}</svg><div class="ctip" style="display:none"></div>`;
  box._geo = {X, Y, W}; box._all = all; box._S = S;
  const si = all.indexOf(chartSel.t3chart);
  if (si >= 0) t3Point(box, si); else delete chartSel.t3chart;
}
function t3Point(box, i) {
  if (!box || !box._geo || box._all[i] == null) return;
  const ts = box._all[i], {X, Y, W} = box._geo, x = X(ts);
  chartSel.t3chart = ts;
  const vl = box.querySelector(".vl"); vl.setAttribute("x1", x); vl.setAttribute("x2", x); vl.style.display = "";
  const dots = box.querySelectorAll(".sel");
  let rows = "";
  box._S.forEach((s, j) => {
    // 그 시각 이전의 가장 최근 값 (없으면 표시 안 함)
    let p = null; for (const q of s.pts) { if (q.ts <= ts) p = q; else break; }
    const dot = dots[j];
    if (p) { dot.setAttribute("cx", X(p.ts)); dot.setAttribute("cy", Y(p.v)); dot.style.display = ""; } else dot.style.display = "none";
    rows += `<br><i style="background:var(--${s.c})"></i>${esc((s.text || "").slice(0, 14)) || "게시물"} <b>${p ? sgn(p.v) : "–"}</b>${p ? ` <small>(누적 ${num(p.tot)}회)</small>` : ""}`;
  });
  const tip = box.querySelector(".ctip");
  tip.innerHTML = fullT(ts) + rows; tip.style.display = "block";
  const scale = box.querySelector("svg").getBoundingClientRect().width / W || 1, px = x * scale, tw = tip.offsetWidth;
  tip.style.left = Math.min(Math.max(0, px - tw / 2), box.clientWidth - tw) + "px";
}
document.addEventListener("mouseover", e => { const h = e.target.closest && e.target.closest("#t3chart [data-ti]"); if (h) t3Point(h.closest(".fchart"), +h.dataset.ti); });
document.addEventListener("click", e => { const h = e.target.closest && e.target.closest("#t3chart [data-ti]"); if (h) t3Point(h.closest(".fchart"), +h.dataset.ti); });

/* ---------- 댓글 많이 단 계정 TOP 10 (모든 게시물·릴스의 댓글+답글을 계정별로 집계, 내 계정 제외) ---------- */
const TC_TIP = "수집된 모든 게시물·릴스의 댓글과 답글을 계정별로 센 순위예요(내 계정 제외). 3분마다 갱신돼요.";
// 순위에서 뺄 내 관련 계정(소문자 비교) — 필요하면 여기에 추가. instagram.username은 자동 제외
const OWN_ACCOUNTS = ["sps_brows_academy", "sps_brow_korea", "yeo_duri_an", "aube_star"];
const tcOwn = u => isOwner(u) || OWN_ACCOUNTS.some(a => String(a).toLowerCase() === String(u).toLowerCase());
const tcOpen = new Set();  // 펼친 계정 — 1분 새로고침 후에도 유지
function topCommenters(d) {
  const m = new Map();
  (d.posts || []).forEach(p => threadsOf(p).forEach(t => [t.root, ...t.replies].forEach(c => {
    const u = String(c.user || "").trim();
    if (!u || tcOwn(u)) return;
    const k = u.toLowerCase();
    let a = m.get(k);
    if (!a) m.set(k, a = {user: u, n: 0, posts: new Set(), last: 0, th: 0, got: 0, cs: []});
    a.n++; a.posts.add(pid(p)); a.last = Math.max(a.last, ts(c.time));
    if (c === t.root) { a.th++; if (t.done) a.got++; }
    a.cs.push({c, p, th: t.id});
  })));
  return [...m.values()].sort((a, b) => b.n - a.n || b.last - a.last).slice(0, 10);
}
function topCmHTML(d) {
  const head = `<h2 class="tgh has-tip" tabindex="0">댓글 많이 단 계정 TOP 10 <i class="q">?</i><div class="tip">${TC_TIP}</div></h2>`;
  const rows = topCommenters(d);
  if (!rows.length) return head + `<div class="card empty">아직 집계할 댓글이 없어요</div>`;
  const capped = (d.posts || []).some(p => (p.comments_count || 0) > (p.comments || []).length);
  const max = Math.max(...rows.map(r => r.n), 1);
  return head + `<div class="card tg">${capped ? `<div class="sub">일부 게시물은 댓글이 많아 최근 300개까지만 집계돼요</div>` : ""}` + rows.map((r, i) => {
    const k = r.user.toLowerCase(), on = tcOpen.has(k);
    const ini = ([...r.user.replace(/^[@._]+/, "")][0] || "?").toUpperCase();
    const list = on ? r.cs.slice().sort((a, b) => ts(b.c.time) - ts(a.c.time)) : [];
    return `<div class="tgr tcr${on ? " on" : ""}" data-tcu="${esc(k)}" tabindex="0" role="button" aria-expanded="${on}">
      <span class="rk">${i + 1}</span><span class="tca" style="background:${avColor(r.user)}">${esc(ini)}</span>
      <span class="mn"><span class="l1"><b class="u">@${esc(r.user)}</b><span class="rt">최근 ${rel(r.last)}</span></span>
        <span class="l2"><span class="bt"><span class="bf" style="width:${(r.n / max * 100).toFixed(1)}%"></span></span><span class="lb">댓글 ${num(r.n)}개 · ${num(r.posts.size)}개 게시물에 작성</span></span>
        ${r.th ? `<span class="l3"><span class="lv ${r.got ? "s" : "w"}" title="이 계정이 단 원댓글 중 내가 답글 단 대화 수">답글 받음 ${num(r.got)}/${num(r.th)}</span></span>` : ""}</span></div>` +
      (on ? `<div class="tcl">${list.slice(0, 30).map(x => `<div class="tci" data-th="${esc(x.th)}" tabindex="0" role="button">
        ${x.p.image ? `<img loading="lazy" src="${esc(x.p.image)}" alt="" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : `<span class="ph"></span>`}
        <span class="tx">${x.c.reply ? "↳ " : ""}${esc(x.c.text) || "<span class='muted'>(내용 없음)</span>"}<small>${rel(x.c.time)} · ${when(x.c.time)}</small></span></div>`).join("")}${list.length > 30 ? `<div class="tcm">외 ${num(list.length - 30)}개 더</div>` : ""}</div>` : "");
  }).join("") + `</div>`;
}
function tcToggle(k) {
  tcOpen.has(k) ? tcOpen.delete(k) : tcOpen.add(k);
  const box = document.getElementById("tcbox");
  if (box && data && data.instagram) { box.innerHTML = topCmHTML(data.instagram); const el = box.querySelector(`[data-tcu="${CSS.escape(k)}"]`); if (el) el.focus({preventScroll: true}); }
}

/* ---------- 업데이트별 증감 차트 (instagram.runs: 데이터 업데이트마다 한 행) ---------- */
const GAP_MS = 15 * 6e4;
const CHARTS = [
  {id: "fchart", key: "followers", title: "팔로워 수", abs: v => `팔로워 ${num(v)}명`},
  {id: "lchart", key: "likes", title: "전체 좋아요", abs: v => `전체 좋아요 ${num(v)}`},
  {id: "alchart", key: "avg_likes", title: "게시물당 평균 좋아요", dec: 2, tip: "게시물당 평균 좋아요 = 전체 좋아요 ÷ 게시물 수(피드 게시글 + 릴스). 좋아요가 실제로 얼마나 붙고 있는지 흐름을 봐요. 새 게시물이 올라오면 좋아요 0에서 시작해 평균이 잠깐 내려갈 수 있어요.", notes: true, abs: v => `평균 좋아요 ${v.toFixed(2)}`},
  {id: "vchart", key: "views_total", title: "전체 조회수", abs: v => `전체 조회수 ${num(v)}`},
  {id: "avchart", key: "avg_views", title: "게시물당 평균 조회수", dec: 2, tip: "게시물당 평균 조회수 = 전체 조회수 ÷ 게시물 수(피드 게시글 + 릴스). 새 게시물이 올라오면 조회수 0에서 시작해 평균이 잠깐 내려갈 수 있어요.", notes: true, abs: v => `평균 조회수 ${v.toFixed(2)}`},
  {id: "achart", key: "avg_reaction", title: "게시물당 평균 반응", dec: 2, tip: AVG_TIP, notes: true, abs: v => `평균 반응 ${v.toFixed(2)}`},
];
const chartSel = {};   // 차트 id → 선택된 점의 시각(t) — 새로고침 후에도 유지
const fx = (n, dec) => dec ? Math.abs(n).toLocaleString("ko-KR", {minimumFractionDigits: dec, maximumFractionDigits: dec}) : num(Math.abs(n));
const sgn = (n, dec = 0) => (n > 0 ? "+" : n < 0 ? "−" : "±") + fx(n, dec);

// 업데이트(약 3분)마다 한 점: 그 시점의 총합 값을 그대로 찍음 (팔로워가 늘면 계속 우상향)

function drawCharts() { CHARTS.forEach(drawChart); drawTop3(); }
function drawChart(c) {

  sum.innerHTML = `현재 <b>${dec ? last.v.toFixed(dec) : num(last.v)}</b> · ${fullT(first.ts)}부터 <b class="${total > 0 ? "up" : total < 0 ? "dn" : ""}">${sgn(total, dec)}</b>`;

  const raw = (hi - lo) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = Math.max(minStep, [1, 2, 5, 10].map(m => m * mag).find(st => st >= raw));
  const sd = Math.max(0, Math.min(dec, -Math.floor(Math.log10(step) + 1e-9)));

  const X = ts => L + (ts - t0) / span * pw, Y = v => TP + (hi - v) / (hi - lo) * ph;

  for (let k = k0; k <= k1; k++) {

  const maxLab = Math.max(2, Math.floor(pw / 70));
  const steps = [3, 5, 10, 15, 30, 60, 120, 180, 360, 720, 1440].map(m => m * 6e4);

  for (let ts = Math.ceil((t0 + off) / every) * every - off; ts <= t1; ts += every) {
    const k = kst(ts);
    g += `<text class="ax" x="${X(ts).toFixed(1)}" y="${H - 16}" text-anchor="middle">${p2(k.h)}:${p2(k.m)}</text><text class="ax" x="${X(ts).toFixed(1)}" y="${H - 3}" text-anchor="middle">${k.mo}/${k.d}</text>`;
  }
  const line = pts.map(p => `${p.brk ? "M" : "L"}${X(p.ts).toFixed(1)},${Y(p.v).toFixed(1)}`).join("");

    if (p.gap) dots += `<circle class="pt gap" cx="${x.toFixed(1)}" cy="${y}" r="3.5"/>`;

function selPoint(box, i) {

    (p.first ? "" : `<br>직전 업데이트 대비 <b class="${p.d > 0 ? "up" : p.d < 0 ? "dn" : "zz"}">${sgn(p.d, box._c.dec)}</b>${p.gap ? ` <small>(${num(p.gapMin)}분 공백 후)</small>` : ""}`) +

const clearAll = () => document.querySelectorAll(".fchart").forEach(clearPoint);

let rsz; window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (tab === "instagram") drawCharts(); }, 150); });

document.addEventListener("click", e => {

/* ---------- 시간대별 평균 조회수 (instagram.hourly_views: KST 시간대별 전체 조회수 증가량 평균) ---------- */
const HV_TIP = "하루를 1시간 단위로 나눠, 각 시간대에 전체 게시물(피드+릴스) 조회수가 평균 얼마나 늘었는지 보여줘요. 날이 쌓일수록 정확해져요.";

// 표시값: 지난 날들의 평균. 지금 시간은 오늘 진행 중인 증가량을 하루치로 포함해 (합 + 진행 중) / (일수 + 1)

function hvText(H, i) {

  return `<b>${r}</b> 평균 <b>+${num(a[i])}회</b> (${i === cur ? `오늘 진행 중 포함, ${num(n[i])}일` : `${num(n[i])}일 평균`})`;

function hourlyHTML(d) {
