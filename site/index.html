<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jay Brows 대시보드</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e3de;--ig:#d62976;--fb:#1877f2;--warn:#b45309;--warnbg:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--text:#f2f2f2;--muted:#9a9a9f;--line:#2e2e2e;--warn:#fbbf24;--warnbg:#3a2e10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h1{font-size:22px;margin:0}
.muted{color:var(--muted);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.grid+.grid{margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.stat{position:relative}
.stat .delta{font-style:normal;font-size:12.5px;white-space:nowrap;font-weight:600;margin-left:6px;color:var(--muted)}
.stat .delta.up{color:#16a34a}.stat .delta.down{color:#dc2626}
.stat b{display:inline}
.stat span{display:block;margin-top:4px}
.stat .q{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--muted);font-size:10px;margin-left:3px}
.stat .tip{display:none;position:absolute;left:8px;right:8px;top:calc(100% + 6px);z-index:5;background:var(--text);color:var(--bg);padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.stat .tip small{opacity:.75}
.has-tip{cursor:help}
@media (hover:hover){.has-tip:hover .tip{display:block}}
.has-tip.show .tip{display:block}
h2{font-size:17px;margin:28px 0 10px}
.warn{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:12px 14px;margin-top:16px;font-size:14px}
.warn ul{margin:6px 0 0;padding-left:18px}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.post{display:flex;flex-direction:column;overflow:hidden;padding:0}
.post img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--line)}
.post .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.post p{margin:0;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nums{display:flex;gap:12px;font-size:13px;color:var(--muted)}
.post a{color:var(--accent);font-size:13px;text-decoration:none}
details{font-size:13px}
summary{cursor:pointer;color:var(--muted)}
.cmt{border-top:1px solid var(--line);padding:6px 0}
.cmt b{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
td.u{font-weight:600;white-space:nowrap}
td.t{color:var(--muted);white-space:nowrap;font-size:12px}
.empty{color:var(--muted);padding:30px;text-align:center}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.toolbar input,.toolbar select{font:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.toolbar input{flex:1 1 200px}
.toolbar select{flex:0 0 auto}
.toolbar .muted{flex:1 1 100%}
.ig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
@media (max-width:520px){.ig-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
@media (max-width:340px){.ig-grid{grid-template-columns:minmax(0,1fr)}}
.igc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.igc.hot{border-color:color-mix(in srgb,var(--ig) 45%,var(--line))}
.thumb{position:relative;display:block;aspect-ratio:4/5;background:var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb img.broken{visibility:hidden}
.badges{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap;pointer-events:none}
.bdg{font-size:11px;font-weight:600;line-height:1;padding:5px 7px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;backdrop-filter:blur(4px);white-space:nowrap}
.bdg.hot{background:var(--ig)}
.bdg.live{background:#e11d48}
.bdg.date{margin-left:auto}
.igc .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.cap{margin:0;font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-line}
.met{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.met span{white-space:nowrap}
.met.sub{color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:7px}
.met.sub b{color:var(--text);font-weight:600}
.igc .foot{margin-top:auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:12px}
.igc .foot a{color:var(--accent);text-decoration:none;white-space:nowrap}
.igc details{font-size:13px}
.igc summary{cursor:pointer;color:var(--muted);list-style:none;user-select:none}
.igc summary::-webkit-details-marker{display:none}
.igc summary::before{content:"▸ ";}
.igc details[open] summary::before{content:"▾ ";}
.clist{max-height:320px;overflow-y:auto;margin-top:6px;padding-right:4px;overscroll-behavior:contain}
.c{padding:6px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.c.r{margin-left:16px;padding-left:8px;border-left:2px solid var(--line);border-top:0}
.c b{font-weight:600}
.c small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.tag{padding:12px 14px;gap:6px}
.tag .who{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px}
.tag .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag .bdg{background:var(--line);color:var(--text);backdrop-filter:none}
td{overflow-wrap:anywhere}
@media (max-width:600px){td.u,td.t{white-space:normal}td.u{max-width:34vw}}
.fchart{position:relative;padding:12px 10px 8px}
.fchart svg{display:block;width:100%;height:auto;overflow:visible}
.fchart .ax{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.fchart .gl{stroke:var(--line);stroke-width:1}
.fchart .zl{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3;opacity:.8}
.fchart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.fchart .pt{fill:var(--card);stroke:var(--accent);stroke-width:2}
.fchart .pt.on{fill:var(--accent)}
.fchart .hit{fill:transparent;cursor:pointer}
.fchart .vl{stroke:var(--accent);stroke-width:1;opacity:.35}
.fchart .ctip{position:absolute;top:8px;z-index:4;pointer-events:none;background:var(--text);color:var(--bg);padding:7px 10px;border-radius:9px;font-size:12.5px;line-height:1.45;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.2);font-variant-numeric:tabular-nums}
.fchart .ctip small{opacity:.75}
.fchart .msg{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.more{display:block;margin:16px auto 0;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 22px;border-radius:999px;cursor:pointer}
</style>
</head>
<body>
<main>
  <header>
    <h1>Jay Brows 대시보드</h1>
    <span class="muted" id="updated"></span>
  </header>
  <div class="tabs">
    <button data-k="instagram" class="on">인스타그램</button>
    <button data-k="facebook">페이스북</button>
  </div>
  <div id="errors"></div>
  <div id="view"></div>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => n == null ? "–" : Number(n).toLocaleString("ko-KR");
// 간단한 한국식 단위: 1.2만, 3.4억
const kn = n => {
  if (n == null || isNaN(n)) return "–";
  n = Number(n); const a = Math.abs(n), f = (v, u) => (Math.round(v * 10) / 10).toLocaleString("ko-KR") + u;
  return a >= 1e8 ? f(n / 1e8, "억") : a >= 1e4 ? f(n / 1e4, "만") : n.toLocaleString("ko-KR");
};
const when = t => t ? new Date(t).toLocaleString("ko-KR", {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "";
const day = t => { if (!t) return ""; const d = new Date(t), now = new Date();
  return d.toLocaleDateString("ko-KR", d.getFullYear() === now.getFullYear() ? {month:"numeric", day:"numeric"} : {year:"2-digit", month:"numeric", day:"numeric"}); };

const store = {
  get(k, d) { try { const v = localStorage.getItem("jb:" + k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("jb:" + k, v); } catch (e) {} }
};
const SUBS = [["FEED", "게시물"], ["REELS", "릴스"], ["STORY", "스토리"], ["TAGGED", "태그·협업"]];
const SORTS = [["new", "최신순"], ["likes", "좋아요순"], ["comments", "댓글순"], ["reach", "도달순"], ["saved", "저장순"]];
const PAGE = 30;
let data, tab = store.get("tab", "instagram"), sub = store.get("sub", "FEED"), sort = store.get("sort", "new"), q = "", shown = PAGE;
if (!SUBS.some(([k]) => k === sub)) sub = "FEED";
if (!SORTS.some(([k]) => k === sort)) sort = "new";
if (tab !== "instagram" && tab !== "facebook") tab = "instagram";
const openC = new Set();     // 댓글이 펼쳐진 카드 id
let byId = new Map();        // 현재 목록의 id → 게시물

/* ---------- 페이스북 카드 (기존 그대로) ---------- */
const LABELS = {reach: "도달", views: "조회", saved: "저장", shares: "공유", replies: "답장",
  total_interactions: "총 반응", profile_visits: "프로필 방문", follows: "팔로우"};
const ins = p => p.insights ? Object.entries(LABELS).filter(([k]) => p.insights[k] != null)
  .map(([k, l]) => `<span>${l} ${num(p.insights[k])}</span>`).join("") : "";
// 증감 기준(항목별): (지금 − 24시간) 이전의 가장 최근 기록, 없으면 그 항목이 있는 가장 오래된 기록.
// sameDay: '오늘 …' 값은 자정에 초기화되므로 같은 날(KST) 기록하고만 비교.
const kstDay = ts => new Intl.DateTimeFormat("en-CA", {timeZone: "Asia/Seoul"}).format(new Date(ts));
function baseline(hist, key, nowTs, sameDay = false) {
  if (!hist || !key || !isFinite(nowTs)) return null;
  let rows = hist.filter(r => r && r[key] != null && isFinite(Date.parse(r.t)) && Date.parse(r.t) <= nowTs);
  if (sameDay) { const dd = kstDay(nowTs); rows = rows.filter(r => kstDay(Date.parse(r.t)) === dd); }
  if (!rows.length) return null;
  const target = nowTs - 864e5;
  let b = rows[0];
  for (const r of rows) if (Date.parse(r.t) <= target) b = r;
  const mins = Math.round((nowTs - Date.parse(b.t)) / 6e4);
  if (mins < 10) return null;
  const label = mins >= 23 * 60 ? "어제 같은 시각 대비" : mins >= 60 ? `${Math.round(mins / 60)}시간 전 대비` : `${mins}분 전 대비`;
  return {row: b, label};
}
function stat(label, v, tip = "", base = null, key = null, extra = "") {
  let delta = "";
  if (base && key && v != null && base.row[key] != null) {
    const dv = v - base.row[key];
    delta = `<em class="delta ${dv > 0 ? "up" : dv < 0 ? "down" : ""}" title="${base.label}">${dv > 0 ? "+" : dv < 0 ? "−" : "±"}${num(Math.abs(dv))}</em>`;
  }
  const t = tip ? `${tip}${delta ? `<br><small>증감: ${base.label}</small>` : ""}${extra ? `<br><small>${extra}</small>` : ""}` : "";
  return `<div class="card stat${t ? " has-tip" : ""}" tabindex="0"><b>${num(v)}</b>${delta}<span>${label}${t ? ' <i class="q">?</i>' : ""}</span>${t ? `<div class="tip">${t}</div>` : ""}</div>`;
}
const who = c => (c.reply ? "↳ " : "") + esc(c.user);
const card = (p, extra = "") => `
    <div class="card post">
      ${p.image ? `<img loading="lazy" src="${esc(p.image)}" alt="">` : ""}
      <div class="body">
        <span class="muted">${extra}${when(p.time)}</span>
        <p>${esc(p.text) || "<span class='muted'>(내용 없음)</span>"}</p>
        <div class="nums">${p.likes != null ? `<span>♥ ${num(p.likes)}</span>` : ""}${p.comments_count != null ? `<span>💬 ${num(p.comments_count)}</span>` : ""}${typeof p.shares === "number" ? `<span>↗ ${num(p.shares)}</span>` : ""}${ins(p)}</div>
        ${(p.comments || []).length ? `<details><summary>댓글 보기 (${p.comments.length})</summary>${p.comments.map(c => `<div class="cmt"><b>${who(c)}</b> ${esc(c.text)}</div>`).join("")}</details>` : ""}
        <a href="${esc(p.url)}" target="_blank" rel="noopener">원문 보기 →</a>
      </div>
    </div>`;

/* ---------- 인스타그램 카드 ---------- */
const pid = p => String(p.id || p.url || p.time);
const I = p => p.insights || {};
const typeLabel = p => p.kind === "REELS" ? "릴스" : p.type === "CAROUSEL_ALBUM" ? "캐러셀" : p.type === "VIDEO" ? "동영상" : "사진";
const metric = {
  new: p => +new Date(p.time || 0),
  likes: p => p.likes ?? I(p).likes ?? -1,
  comments: p => p.comments_count ?? I(p).comments ?? -1,
  reach: p => I(p).reach ?? -1,
  saved: p => I(p).saved ?? -1,
};
const eng = p => (p.likes || 0) + (p.comments_count || 0) + (I(p).saved || 0) + (I(p).shares || 0);

// 상위 10% 기준값 (도달 또는 반응)
function topCut(list, f) {
  const v = list.map(f).filter(x => x > 0).sort((a, b) => b - a);
  return v.length >= 5 ? v[Math.max(0, Math.ceil(v.length * 0.1) - 1)] : Infinity;
}

const cmtHTML = p => (p.comments || []).map(c =>
  `<div class="c${c.reply ? " r" : ""}"><b>${esc(c.user)}</b> ${esc(c.text)}<small>${when(c.time)}${c.likes ? ` · ♥ ${num(c.likes)}` : ""}</small></div>`).join("");

function igCard(p, hot) {
  const i = I(p), id = pid(p), cs = p.comments || [], open = openC.has(id);
  const watch = i.ig_reels_avg_watch_time != null ? (i.ig_reels_avg_watch_time / 1000).toFixed(1) + "초" : null;
  const extra = [["도달", i.reach], ["조회", i.views], ["저장", i.saved], ["공유", i.shares]]
    .filter(([, v]) => v != null).map(([l, v]) => `<span>${l} <b>${kn(v)}</b></span>`);
  if (watch) extra.push(`<span>평균 시청 <b>${watch}</b></span>`);
  return `<article class="igc${hot ? " hot" : ""}">
    <a class="thumb" href="${esc(p.url)}" target="_blank" rel="noopener">
      ${p.image ? `<img loading="lazy" decoding="async" referrerpolicy="no-referrer" src="${esc(p.image)}" alt="" onerror="this.classList.add('broken')">` : ""}
      <div class="badges">${p.live ? `<span class="bdg live">게시 중</span>` : ""}<span class="bdg">${typeLabel(p)}</span>${hot ? `<span class="bdg hot">인기</span>` : ""}<span class="bdg date">${day(p.time)}</span></div>
    </a>
    <div class="body">
      <p class="cap">${esc(p.text) || "<span class='muted'>(내용 없음)</span>"}</p>
      <div class="met"><span>♥ ${kn(p.likes ?? i.likes)}</span><span>💬 ${kn(p.comments_count ?? i.comments)}</span></div>
      ${extra.length ? `<div class="met sub">${extra.join("")}</div>` : ""}
      ${cs.length ? `<details data-id="${esc(id)}"${open ? " open" : ""}><summary>댓글 ${num(cs.length)}개</summary><div class="clist">${open ? cmtHTML(p) : ""}</div></details>` : ""}
      <div class="foot"><span class="muted">${when(p.time)}</span><a href="${esc(p.url)}" target="_blank" rel="noopener">원문 →</a></div>
    </div>
  </article>`;
}

const tagCard = (p, hot) => `<article class="igc tag${hot ? " hot" : ""}">
    <div class="who"><b>@${esc(p.owner)}</b><span class="bdg">${typeLabel(p)} · ${day(p.time)}</span></div>
    <p class="cap">${esc(p.text) || "<span class='muted'>(내용 없음)</span>"}</p>
    <div class="foot"><div class="met"><span>♥ ${kn(p.likes)}</span><span>💬 ${kn(p.comments_count)}</span>${hot ? `<span class="bdg hot">인기</span>` : ""}</div><a href="${esc(p.url)}" target="_blank" rel="noopener">원문 →</a></div>
  </article>`;

function igLists(d) {
  const all = d.posts || [];
  return {FEED: all.filter(p => p.kind === "FEED"), REELS: all.filter(p => p.kind === "REELS"), STORY: d.stories || [], TAGGED: d.tagged || []};
}

function renderList() {
  const box = document.getElementById("iglist");
  if (!box || !data || !data.instagram) return;
  const src = igLists(data.instagram)[sub] || [];
  const ql = q.trim().toLowerCase();
  let list = ql ? src.filter(p => (p.text || "").toLowerCase().includes(ql) || (p.owner || "").toLowerCase().includes(ql)) : src.slice();
  const f = metric[sort];
  list.sort((a, b) => (f(b) - f(a)) || (metric.new(b) - metric.new(a)));
  const cutR = topCut(src, p => I(p).reach || 0), cutE = topCut(src, eng);
  const isHot = p => (I(p).reach || 0) >= cutR || eng(p) >= cutE;
  byId = new Map(src.map(p => [pid(p), p]));
  const page = list.slice(0, shown);
  const noIns = (sort === "reach" || sort === "saved") && !src.some(p => I(p)[sort] != null);
  document.getElementById("igcount").textContent =
    `${num(list.length)}개 중 ${num(page.length)}개 표시` + (ql ? ` · "${q.trim()}" 검색` : "") +
    (noIns ? " · 이 목록에는 아직 인사이트 데이터가 없습니다" : (sort === "reach" || sort === "saved") ? " · 인사이트 없는 항목은 뒤로" : "");
  box.innerHTML = page.length
    ? `<div class="ig-grid">${page.map(p => sub === "TAGGED" ? tagCard(p, isHot(p)) : igCard(p, isHot(p))).join("")}</div>` +
      (list.length > page.length ? `<button class="more" data-more="1">더 보기 (${num(list.length - page.length)}개 남음)</button>` : "")
    : `<div class="card empty">${ql ? "검색 결과가 없습니다." : "아직 없습니다."}</div>`;
}

/* ---------- 전체 화면 ---------- */
function render() {
  document.querySelectorAll(".tabs button[data-k]").forEach(b => b.classList.toggle("on", b.dataset.k === tab));
  document.documentElement.style.setProperty("--accent", tab === "instagram" ? "var(--ig)" : "var(--fb)");
  const d = data[tab], v = document.getElementById("view");
  if (!d) { v.innerHTML = `<div class="card empty">아직 데이터가 없습니다. 토큰 연결 후 표시됩니다.</div>`; return; }
  // 검색창 포커스/커서 보존
  const ae = document.activeElement, focusQ = ae && ae.id === "igq", sel = focusQ ? [ae.selectionStart, ae.selectionEnd] : null;
  const isIG = tab === "instagram";
  const all_posts = d.posts || [];
  const posts = isIG ? all_posts.filter(p => p.kind === "FEED") : all_posts;
  const likes = posts.reduce((a, p) => a + (p.likes || 0), 0);
  const cmts = posts.reduce((a, p) => a + (p.comments_count || 0), 0);
  const t = d.today || {};
  const H = d.follower_history || [], up = Date.parse(data.updated), nowTs = isFinite(up) ? up : (H.length ? Date.parse(H[H.length - 1].t) : NaN);
  const B = (k, sameDay) => isIG ? baseline(H, k, nowTs, sameDay) : null, y = d.yesterday || {};
  const yd = k => y[k] != null ? `어제 하루 전체: ${num(y[k])}` : "";
  const T = d.totals || {}, tp = T.posts || 0, cov = T.insights_coverage ?? tp;
  const covNote = tp && cov < tp ? `인사이트 수집된 ${num(cov)}/${num(tp)}개 게시물 기준 (곧 전체로 채워져요)` : "";
  const r1 = x => x == null || !isFinite(x) ? "–" : (Math.round(x * 10) / 10).toLocaleString("ko-KR");
  const aL = tp ? (T.likes || 0) / tp : null, aC = tp ? (T.comments || 0) / tp : null;
  const aS = cov ? (T.shares || 0) / cov : null, aV = cov ? (T.saves || 0) / cov : null;
  const avg = aL == null ? null : Math.round(aL + aC + (aS || 0) + (aV || 0));
  let h = (isIG ? `<div class="grid">` +
      stat("오늘 도달", t.reach, "오늘 내 게시물·릴스·스토리·프로필을 한 번이라도 본 계정 수예요. 한 사람이 여러 번 봐도 1명으로 세요.", B("reach", true), "reach", yd("reach")) +
      stat("오늘 조회", t.views, "오늘 콘텐츠가 화면에 표시되거나 재생된 총 횟수예요. 같은 사람이 여러 번 보면 모두 셉니다.", B("views", true), "views", yd("views")) +
      stat("오늘 프로필 방문", t.profile_views, "오늘 내 프로필 페이지를 연 횟수예요.", B("profile_views", true), "profile_views", yd("profile_views")) +
      stat("오늘 반응 계정", t.accounts_engaged, "오늘 좋아요·댓글·저장·공유·답장 등으로 반응한 계정 수예요(중복 제외).", B("accounts_engaged", true), "accounts_engaged", yd("accounts_engaged")) +
      `</div>` : "") +
    `<div class="grid">` +
    (isIG
      ? stat("팔로워", d.followers, "나를 팔로우하는 계정 수예요.", B("followers"), "followers") +
        stat("전체 좋아요", T.likes, `지금까지 올린 모든 게시물·릴스${tp ? ` ${num(tp)}개` : ""}가 받은 좋아요 합계예요.`, B("likes"), "likes") +
        stat("전체 댓글", T.comments, `모든 게시물·릴스${tp ? ` ${num(tp)}개` : ""}에 달린 댓글 합계(답글 포함)예요.`, B("comments"), "comments") +
        stat("전체 공유", T.shares, "모든 게시물·릴스가 DM·스토리 등으로 공유된 횟수 합계예요.", B("shares"), "shares", covNote) +
        stat("전체 저장", T.saves, "모든 게시물·릴스를 사람들이 저장(북마크)한 횟수 합계예요.", B("saves"), "saves", covNote) +
        stat("게시물당 평균 반응", avg,
          `게시물 하나가 평균적으로 받는 반응(좋아요+댓글+공유+저장)이에요.<br>평균 좋아요 ${r1(aL)} · 댓글 ${r1(aC)} · 공유 ${r1(aS)} · 저장 ${r1(aV)}` +
          `<br><small>계산: (좋아요+댓글) ÷ 전체 게시물 수 + (공유+저장) ÷ 인사이트 수집 게시물 수. 공유·저장은 인사이트를 가져온 게시물에서만 합산되므로, 전체 게시물 수로 나누면 실제보다 작게 나와서 수집된 게시물 수로 나눠요.</small>`)
      : stat("팔로워", d.followers) + stat("페이지 좋아요", d.fans) +
        stat(`최근 ${posts.length}개 좋아요`, likes) + stat(`최근 ${posts.length}개 댓글`, cmts) +
        stat("게시물당 평균 반응", posts.length ? Math.round((likes + cmts) / posts.length) : null)) +
    `</div>`;
  if (isIG) h += `<h2>시간당 팔로워 증감</h2><div class="card fchart" id="fchart"></div>`;

  const all = all_posts.flatMap(p => (p.comments || []).map(c => ({...c, post: p})))
    .sort((a, b) => new Date(b.time) - new Date(a.time)).slice(0, 100);
  h += `<h2>최근 댓글 (${all.length})</h2><div class="card">` + (all.length
    ? `<table>${all.map(c => `<tr><td class="u">${who(c)}</td><td>${esc(c.text)}</td><td class="t"><a href="${esc(c.post.url)}" target="_blank" rel="noopener">${when(c.time)}</a></td></tr>`).join("")}</table>`
    : `<div class="empty">댓글이 없습니다.</div>`) + `</div>`;

  if (isIG) {
    const lists = igLists(d);
    h += `<div class="tabs sub">` + SUBS.map(([k, l]) =>
      `<button data-s="${k}" class="${k === sub ? "on" : ""}">${l} (${lists[k].length})</button>`).join("") + `</div>`;
    h += sub === "STORY" ? `<p class="muted">스토리는 24시간 뒤 사라지므로 대시보드가 수집을 시작한 뒤의 스토리만 쌓입니다. 하이라이트는 Meta API에서 제공하지 않습니다.</p>` : "";
    h += `<div class="toolbar">
        <input id="igq" type="search" placeholder="${sub === "TAGGED" ? "캡션·계정 검색" : "캡션 검색"}" value="${esc(q)}" autocomplete="off">
        <select id="igsort" aria-label="정렬">${SORTS.map(([k, l]) => `<option value="${k}"${k === sort ? " selected" : ""}>${l}</option>`).join("")}</select>
        <span class="muted" id="igcount"></span>
      </div><div id="iglist"></div>`;
  } else {
    h += `<h2>게시물</h2><div class="posts">` + posts.map(p => card(p)).join("") + `</div>`;
  }
  v.innerHTML = h;
  if (isIG) {
    drawChart();
    renderList();
    if (focusQ) { const el = document.getElementById("igq"); el.focus(); try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
  }
}

/* ---------- 시간당 팔로워 증감 차트 ---------- */
const kstH = new Intl.DateTimeFormat("ko-KR", {timeZone: "Asia/Seoul", hour: "numeric", hourCycle: "h23"});
const kstDH = new Intl.DateTimeFormat("ko-KR", {timeZone: "Asia/Seoul", month: "long", day: "numeric", hour: "numeric", hourCycle: "h23"});
const sgn = n => (n > 0 ? "+" : n < 0 ? "−" : "±") + num(Math.abs(n));
let chartPts = [], chartSel = null;   // chartSel: 선택된 점의 시각(t) — 새로고침 후에도 유지
function drawChart() {
  const box = document.getElementById("fchart");
  if (!box || !data || !data.instagram) return;
  const rows = (data.instagram.follower_history || []).filter(r => r.followers != null && !isNaN(Date.parse(r.t)));
  const end = rows.length ? Date.parse(rows[rows.length - 1].t) : 0, from = end - 48 * 36e5;
  const pts = [];
  for (let i = 1; i < rows.length; i++) {
    const ts = Date.parse(rows[i].t);
    if (ts < from) continue;
    pts.push({t: rows[i].t, ts, f: rows[i].followers, d: rows[i].followers - rows[i - 1].followers});
  }
  chartPts = pts;
  if (pts.length < 2) { box.innerHTML = `<div class="msg">데이터 수집 중 — 1시간마다 한 점씩 쌓입니다</div>`; return; }
  const W = Math.max(280, box.clientWidth - 20), H = W < 480 ? 200 : 240;
  const L = 40, R = 10, TP = 12, B = 26, pw = W - L - R, ph = H - TP - B;
  const t0 = pts[0].ts, t1 = pts[pts.length - 1].ts, span = Math.max(1, t1 - t0);
  let lo = Math.min(0, ...pts.map(p => p.d)), hi = Math.max(0, ...pts.map(p => p.d));
  if (lo === hi) { hi += 1; lo -= 1; }
  const raw = (hi - lo) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = Math.max(1, [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw));
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const X = ts => L + (ts - t0) / span * pw, Y = v => TP + (hi - v) / (hi - lo) * ph;
  let g = "";
  for (let v = lo; v <= hi + 1e-9; v += step)
    g += `<line class="${v === 0 ? "zl" : "gl"}" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v > 0 ? "+" : ""}${num(v)}</text>`;
  if (lo > 0 || hi < 0) g += `<line class="zl" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  // x축 라벨: 화면 폭에 맞춰 간격 조절 (정시 기준)
  const maxLab = Math.max(2, Math.floor(pw / 46)), hrs = span / 36e5;
  const every = [1, 2, 3, 4, 6, 12, 24].find(n => hrs / n <= maxLab) || 24;
  const hourOf = ts => Number(kstH.format(new Date(ts)).replace(/\D/g, ""));
  let lastLab = -Infinity;
  for (const p of pts) {
    const hh = hourOf(p.ts);
    if (hh % every || p.ts - lastLab < every * 36e5 * 0.9) continue;
    lastLab = p.ts;
    g += `<text class="ax" x="${X(p.ts)}" y="${H - 6}" text-anchor="middle">${hh}시</text>`;
  }
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p.ts).toFixed(1)},${Y(p.d).toFixed(1)}`).join("");
  const r = pts.length > 60 ? 2.5 : 3.5;
  let dots = "", hits = "";
  pts.forEach((p, i) => {
    const x = X(p.ts), xl = i ? (x + X(pts[i - 1].ts)) / 2 : L, xr = i < pts.length - 1 ? (x + X(pts[i + 1].ts)) / 2 : W - R;
    dots += `<circle class="pt" data-i="${i}" cx="${x}" cy="${Y(p.d)}" r="${r}"/>`;
    hits += `<rect class="hit" data-pi="${i}" x="${xl}" y="${TP}" width="${Math.max(1, xr - xl)}" height="${ph}"/>`;
  });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="최근 48시간 시간당 팔로워 증감">${g}<line class="vl" id="fvl" x1="0" x2="0" y1="${TP}" y2="${TP + ph}" style="display:none"/><path class="ln" d="${line}"/>${dots}${hits}</svg><div class="ctip" style="display:none"></div>`;
  box._geo = {X, Y, W, L};
  const si = pts.findIndex(p => p.t === chartSel);
  if (si >= 0) selPoint(si); else chartSel = null;
}
function selPoint(i) {
  const box = document.getElementById("fchart"), p = chartPts[i];
  if (!box || !p || !box._geo) return;
  chartSel = p.t;
  const {X, W} = box._geo, x = X(p.ts);
  box.querySelectorAll(".pt").forEach(c => c.classList.toggle("on", +c.dataset.i === i));
  const vl = box.querySelector("#fvl"); vl.setAttribute("x1", x); vl.setAttribute("x2", x); vl.style.display = "";
  const tip = box.querySelector(".ctip");
  tip.innerHTML = `${kstDH.format(new Date(p.ts))}<br>증감 <b>${sgn(p.d)}</b><br><small>팔로워 ${num(p.f)}명</small>`;
  tip.style.display = "block";
  const scale = box.querySelector("svg").getBoundingClientRect().width / W || 1, px = 10 + x * scale, tw = tip.offsetWidth;
  tip.style.left = Math.min(Math.max(4, px - tw / 2), box.clientWidth - tw - 4) + "px";
}
function clearPoint() {
  const box = document.getElementById("fchart"); chartSel = null;
  if (!box) return;
  box.querySelectorAll(".pt.on").forEach(c => c.classList.remove("on"));
  const vl = box.querySelector("#fvl"), tip = box.querySelector(".ctip");
  if (vl) vl.style.display = "none"; if (tip) tip.style.display = "none";
}
document.addEventListener("mouseover", e => { const h = e.target.closest && e.target.closest("#fchart [data-pi]"); if (h) selPoint(+h.dataset.pi); });
document.addEventListener("mouseout", e => { if (e.target.closest && e.target.closest("#fchart svg") && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("#fchart svg"))) clearPoint(); });
let rsz; window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (tab === "instagram") drawChart(); }, 150); });

document.addEventListener("click", e => {
  const hp = e.target.closest("#fchart [data-pi]");
  if (hp) { selPoint(+hp.dataset.pi); return; }
  if (!e.target.closest("#fchart")) clearPoint();
  const st = e.target.closest(".has-tip");
  document.querySelectorAll(".has-tip.show").forEach(x => { if (x !== st) x.classList.remove("show"); });
  if (st) { st.classList.toggle("show"); return; }
  if (e.target.closest("button[data-more]")) { shown += PAGE; renderList(); return; }
  const b = e.target.closest("button[data-k],button[data-s]");
  if (!b) return;
  if (b.dataset.k) { tab = b.dataset.k; store.set("tab", tab); }
  else if (b.dataset.s !== sub) { sub = b.dataset.s; shown = PAGE; store.set("sub", sub); }
  render();
});
document.addEventListener("input", e => {
  if (e.target.id !== "igq") return;
  q = e.target.value; shown = PAGE; renderList();
});
document.addEventListener("change", e => {
  if (e.target.id !== "igsort") return;
  sort = e.target.value; shown = PAGE; store.set("sort", sort); renderList();
});
// 댓글 펼침 상태 기억 + 펼칠 때만 댓글 렌더 (toggle은 버블링되지 않아 capture 사용)
document.addEventListener("toggle", e => {
  const dt = e.target;
  if (!(dt instanceof HTMLDetailsElement) || !dt.dataset.id) return;
  const id = dt.dataset.id;
  if (dt.open) {
    openC.add(id);
    const box = dt.querySelector(".clist"), p = byId.get(id);
    if (box && p && !box.innerHTML) box.innerHTML = cmtHTML(p);
  } else openC.delete(id);
}, true);

const load = () => fetch("data.json?" + Date.now()).then(r => r.json()).then(j => {
  data = j;
  document.getElementById("updated").textContent = "업데이트: " + new Date(j.updated).toLocaleString("ko-KR");
  document.getElementById("errors").innerHTML = !(j.errors && j.errors.length) ? "" : `<div class="warn">일부 데이터를 가져오지 못했습니다<ul>${j.errors.map(e => `<li>${esc(e)}</li>`).join("")}</ul></div>`;
  // 새로고침 시 열린 댓글창 스크롤 위치 보존
  const scr = {}; document.querySelectorAll("details[data-id][open] .clist").forEach(el => { scr[el.parentNode.dataset.id] = el.scrollTop; });
  render();
  document.querySelectorAll("details[data-id][open] .clist").forEach(el => { const s = scr[el.parentNode.dataset.id]; if (s) el.scrollTop = s; });
}).catch(() => { document.getElementById("view").innerHTML = `<div class="card empty">data.json을 불러오지 못했습니다.</div>`; });
load();
setInterval(load, 60000);  // 1분마다 새 데이터 확인
</script>
</body>
</html>
