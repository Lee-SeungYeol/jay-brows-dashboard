<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jay Brows 대시보드</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e3de;--ig:#d62976;--fb:#1877f2;--warn:#b45309;--warnbg:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--text:#f2f2f2;--muted:#9a9a9f;--line:#2e2e2e;--warn:#fbbf24;--warnbg:#3a2e10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h1{font-size:22px;margin:0}
.muted{color:var(--muted);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.grid+.grid{margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.stat{position:relative}
.stat .delta{font-style:normal;font-size:12.5px;white-space:nowrap;font-weight:600;margin-left:6px;color:var(--muted)}
.stat .delta.up{color:#16a34a}.stat .delta.down{color:#dc2626}
.stat b{display:inline}
.stat span{display:block;margin-top:4px}
.stat .q,.chcard .q{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--muted);font-size:10px;margin-left:3px}
.stat .tip,.chcard .tip{display:none;position:absolute;left:8px;right:8px;top:calc(100% + 6px);z-index:5;background:var(--text);color:var(--bg);padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.stat .tip small,.chcard .tip small{opacity:.75}
.has-tip{cursor:help}
@media (hover:hover){.has-tip:hover .tip{display:block}}
.has-tip.show .tip{display:block}
h2{font-size:17px;margin:28px 0 10px}
.warn{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:12px 14px;margin-top:16px;font-size:14px}
.warn ul{margin:6px 0 0;padding-left:18px}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.post{display:flex;flex-direction:column;overflow:hidden;padding:0}
.post img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--line)}
.post .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.post p{margin:0;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nums{display:flex;gap:12px;font-size:13px;color:var(--muted)}
.post a{color:var(--accent);font-size:13px;text-decoration:none}
details{font-size:13px}
summary{cursor:pointer;color:var(--muted)}
.cmt{border-top:1px solid var(--line);padding:6px 0}
.cmt b{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
td.u{font-weight:600;white-space:nowrap}
td.t{color:var(--muted);white-space:nowrap;font-size:12px}
.empty{color:var(--muted);padding:30px;text-align:center}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.toolbar input,.toolbar select{font:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.toolbar input{flex:1 1 200px}
.toolbar select{flex:0 0 auto}
.toolbar .muted{flex:1 1 100%}
.ig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
@media (max-width:520px){.ig-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
@media (max-width:340px){.ig-grid{grid-template-columns:minmax(0,1fr)}}
.igc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.igc.hot{border-color:color-mix(in srgb,var(--ig) 45%,var(--line))}
.thumb{position:relative;display:block;aspect-ratio:4/5;background:var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb img.broken{visibility:hidden}
.badges{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap;pointer-events:none}
.bdg{font-size:11px;font-weight:600;line-height:1;padding:5px 7px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;backdrop-filter:blur(4px);white-space:nowrap}
.bdg.hot{background:var(--ig)}
.bdg.date{margin-left:auto}
.igc .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.cap{margin:0;font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-line}
.met{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.met span{white-space:nowrap}
.met.sub{color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:7px}
.met.sub b{color:var(--text);font-weight:600}
.igc .foot{margin-top:auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:12px}
.igc .foot a{color:var(--accent);text-decoration:none;white-space:nowrap}
.igc details{font-size:13px}
.igc summary{cursor:pointer;color:var(--muted);list-style:none;user-select:none}
.igc summary::-webkit-details-marker{display:none}
.igc summary::before{content:"▸ ";}
.igc details[open] summary::before{content:"▾ ";}
.clist{max-height:320px;overflow-y:auto;margin-top:6px;padding-right:4px;overscroll-behavior:contain}
.c{padding:6px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.c.r{margin-left:16px;padding-left:8px;border-left:2px solid var(--line);border-top:0}
.c b{font-weight:600}
.c small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.tag{padding:12px 14px;gap:6px}
.tag .who{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px}
.tag .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag .bdg{background:var(--line);color:var(--text);backdrop-filter:none}
td{overflow-wrap:anywhere}
@media (max-width:600px){td.u,td.t{white-space:normal}td.u{max-width:34vw}}
.chwin{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chwin button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chwin button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.chcard{min-width:0;padding:12px 10px 8px}
.chcard h3{font-size:14.5px;margin:2px 4px 2px;position:relative}
.chcard h3 .tip{font-weight:400;left:0;right:auto;width:min(320px,80vw)}
.chcard:last-child:nth-child(odd){grid-column:1/-1}
.fchart .pt.note{fill:var(--text)}
.fchart .nt{fill:var(--muted);font-size:10px;font-weight:600}
.chsum{font-size:12.5px;color:var(--muted);margin:0 4px 4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.chsum b{color:var(--text);font-weight:600}
.fchart{position:relative;padding-top:4px}
.fchart svg{display:block;width:100%;height:auto;overflow:visible}
.fchart .ax{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.fchart .gl{stroke:var(--line);stroke-width:1}
.fchart .zl{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3;opacity:.8}
.fchart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.fchart .pt{fill:var(--accent);stroke:none}
.fchart .pt.gap{fill:var(--card);stroke:var(--accent);stroke-width:2}
.fchart .sel{fill:var(--accent);stroke:var(--card);stroke-width:2}
.fchart .sel.gap{fill:var(--card);stroke:var(--accent)}
.fchart .hit{fill:transparent;cursor:pointer}
.fchart .vl{stroke:var(--accent);stroke-width:1;opacity:.35}
.fchart .ctip{--up:#4ade80;--dn:#f87171;position:absolute;top:4px;z-index:4;pointer-events:none;background:var(--text);color:var(--bg);padding:7px 10px;border-radius:9px;font-size:12.5px;line-height:1.45;width:max-content;max-width:min(290px,100%);box-shadow:0 6px 20px rgba(0,0,0,.2);font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){.fchart .ctip{--up:#15803d;--dn:#b91c1c}}
.fchart .ctip small{opacity:.75}
.fchart .ctip .up{color:var(--up)}.fchart .ctip .dn{color:var(--dn)}.fchart .ctip .zz{opacity:.7}
.fchart .msg{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.more{display:block;margin:16px auto 0;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 22px;border-radius:999px;cursor:pointer}
/* 댓글 스레드 + 모달 */
.cf{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.cf button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.cf button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.thr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 6px;border-top:1px solid var(--line);cursor:pointer;overflow-wrap:anywhere;border-radius:6px}
.thr:first-child{border-top:0}
.thr:hover,.thr:focus-visible{background:color-mix(in srgb,var(--text) 5%,transparent);outline:none}
.thr .hd{font-size:14px;min-width:0}
.thr .hd b{font-weight:600;margin-right:6px}
.thr .tt{color:var(--muted);font-size:12px;white-space:nowrap;text-align:right}
.thr .tx{grid-column:1/-1;font-size:14px}
.thr .pc{grid-column:1/-1;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb{display:inline-block;font-size:11px;font-weight:600;line-height:1;padding:4px 7px;border-radius:999px;vertical-align:1px;white-space:nowrap;margin-right:4px}
.rb.ok{background:#dcfce7;color:#15803d}
.rb.n{background:var(--line);color:var(--muted)}
@media (prefers-color-scheme:dark){.rb.ok{background:#14532d;color:#86efac}}
.c.th{cursor:pointer}
.c.th:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}
#cm{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
#cm.on{display:flex}
#cm .sh{background:var(--card);color:var(--text);border-radius:16px;width:min(520px,100%);max-height:min(86vh,760px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#cm .top{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
#cm .top img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--line);flex:none}
#cm .top .cp{flex:1;min-width:0;font-size:13px}
#cm .top .cp p{margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
#cm .top a{color:var(--accent);text-decoration:none;font-size:12.5px}
#cm .x{flex:none;border:0;background:none;color:var(--text);font-size:20px;line-height:1;width:36px;height:36px;border-radius:50%;cursor:pointer}
#cm .x:hover{background:var(--line)}
#cm .bd{overflow-y:auto;padding:6px 14px 16px;overscroll-behavior:contain}
.ic{display:flex;gap:10px;padding:10px 0}
.ic.rp{margin-left:42px;padding:6px 0}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
.ic.rp .av{width:26px;height:26px;font-size:11px}
.ic .m{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.ic .m b{font-weight:600;margin-right:5px}
.ic .m small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.ic.me .m{background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:10px;padding:6px 9px}
.atag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--accent);color:#fff;margin-right:5px;vertical-align:1px}
@media (max-width:600px){#cm{padding:0;align-items:flex-end}#cm .sh{width:100%;max-height:none;height:94vh;border-radius:16px 16px 0 0}}
body.lock{overflow:hidden}
</style>
</head>
<body>
<main>
  <header>
    <h1>Jay Brows 대시보드</h1>
    <span class="muted" id="updated"></span>
  </header>
  <div class="tabs">
    <button data-k="instagram" class="on">인스타그램</button>
    <button data-k="facebook">페이스북</button>
  </div>
  <div id="errors"></div>
  <div id="view"></div>
</main>
<div id="cm" role="dialog" aria-modal="true" aria-label="댓글 스레드"><div class="sh"><div class="top" id="cmtop"></div><div class="bd" id="cmbd"></div></div></div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => n == null ? "–" : Number(n).toLocaleString("ko-KR");
// 간단한 한국식 단위: 1.2만, 3.4억
const kn = n => {
  if (n == null || isNaN(n)) return "–";
  n = Number(n); const a = Math.abs(n), f = (v, u) => (Math.round(v * 10) / 10).toLocaleString("ko-KR") + u;
  return a >= 1e8 ? f(n / 1e8, "억") : a >= 1e4 ? f(n / 1e4, "만") : n.toLocaleString("ko-KR");
};
const when = t => t ? new Date(t).toLocaleString("ko-KR", {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "";
const day = t => { if (!t) return ""; const d = new Date(t), now = new Date();
  return d.toLocaleDateString("ko-KR", d.getFullYear() === now.getFullYear() ? {month:"numeric", day:"numeric"} : {year:"2-digit", month:"numeric", day:"numeric"}); };

const store = {
  get(k, d) { try { const v = localStorage.getItem("jb:" + k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("jb:" + k, v); } catch (e) {} }
};
const AVG_TIP = "게시물 하나가 평균적으로 받는 반응이에요.<br>게시물당 평균 반응 = (전체 좋아요 + 전체 댓글 + 전체 공유 + 전체 저장) ÷ 전체 게시물 수 (피드+릴스 전부).<br><small>공유·저장은 인사이트가 수집된 게시물 기준 평균이에요.</small>";
const SUBS = [["FEED", "게시물"], ["REELS", "릴스"], ["TAGGED", "태그·협업"]];
const SORTS = [["new", "최신순"], ["likes", "좋아요순"], ["comments", "댓글순"], ["reach", "도달순"], ["saved", "저장순"]];
const PAGE = 30;
let data, tab = store.get("tab", "instagram"), sub = store.get("sub", "FEED"), sort = store.get("sort", "new"), q = "", shown = PAGE;
if (!SUBS.some(([k]) => k === sub)) sub = "FEED";
if (!SORTS.some(([k]) => k === sort)) sort = "new";
if (tab !== "instagram" && tab !== "facebook") tab = "instagram";
const openC = new Set();     // 댓글이 펼쳐진 카드 id
let byId = new Map();        // 현재 목록의 id → 게시물

/* ---------- 페이스북 카드 (기존 그대로) ---------- */
const LABELS = {reach: "도달", views: "조회", saved: "저장", shares: "공유", replies: "답장",
  total_interactions: "총 반응", profile_visits: "프로필 방문", follows: "팔로우"};
const ins = p => p.insights ? Object.entries(LABELS).filter(([k]) => p.insights[k] != null)
  .map(([k, l]) => `<span>${l} ${num(p.insights[k])}</span>`).join("") : "";
function stat(label, v, tip = "", base = null, key = null, extra = "", vfmt = num) {
  let delta = "";
  if (base && v != null && base.dv != null) {
    const dv = base.dv;
    delta = `<em class="delta ${dv > 0 ? "up" : dv < 0 ? "down" : ""}" title="${base.label}">${dv > 0 ? "+" : dv < 0 ? "−" : "±"}${(base.fmt || num)(Math.abs(dv))}</em>`;
  }
  const t = tip ? `${tip}${delta ? `<br><small>증감: ${base.label}</small>` : ""}${extra ? `<br><small>${extra}</small>` : ""}` : "";
  return `<div class="card stat${t ? " has-tip" : ""}" tabindex="0"><b>${v == null ? "–" : vfmt(v)}</b>${delta}<span>${label}${t ? ' <i class="q">?</i>' : ""}</span>${t ? `<div class="tip">${t}</div>` : ""}</div>`;
}
const who = c => (c.reply ? "↳ " : "") + esc(c.user);
const card = (p, extra = "") => `
    <div class="card post">
      ${p.image ? `<img loading="lazy" src="${esc(p.image)}" alt="">` : ""}
      <div class="body">
        <span class="muted">${extra}${when(p.time)}</span>
        <p>${esc(p.text) || "<span class='muted'>(내용 없음)</span>"}</p>
        <div class="nums">${p.likes != null ? `<span>♥ ${num(p.likes)}</span>` : ""}${p.comments_count != null ? `<span>💬 ${num(p.comments_count)}</span>` : ""}${typeof p.shares === "number" ? `<span>↗ ${num(p.shares)}</span>` : ""}${ins(p)}</div>
        ${(p.comments || []).length ? `<details><summary>댓글 보기 (${p.comments.length})</summary>${cmtHTML(p)}</details>` : ""}
        <a href="${esc(p.url)}" target="_blank" rel="noopener">원문 보기 →</a>
      </div>
    </div>`;

/* ---------- 인스타그램 카드 ---------- */
const pid = p => String(p.id || p.url || p.time);
const I = p => p.insights || {};
const typeLabel = p => p.kind === "REELS" ? "릴스" : p.type === "CAROUSEL_ALBUM" ? "캐러셀" : p.type === "VIDEO" ? "동영상" : "사진";
const metric = {
  new: p => +new Date(p.time || 0),
  likes: p => p.likes ?? I(p).likes ?? -1,
  comments: p => p.comments_count ?? I(p).comments ?? -1,
  reach: p => I(p).reach ?? -1,
  saved: p => I(p).saved ?? -1,
};
const eng = p => (p.likes || 0) + (p.comments_count || 0) + (I(p).saved || 0) + (I(p).shares || 0);

// 상위 10% 기준값 (도달 또는 반응)
function topCut(list, f) {
  const v = list.map(f).filter(x => x > 0).sort((a, b) => b - a);
  return v.length >= 5 ? v[Math.max(0, Math.ceil(v.length * 0.1) - 1)] : Infinity;
}

/* ---------- 댓글 스레드 (평탄화된 댓글 → 원댓글 + 답글 묶음) ---------- */
const ownerNames = () => new Set([data?.instagram?.username, data?.facebook?.name, data?.facebook?.username]
  .filter(Boolean).map(s => String(s).toLowerCase()));
const isOwner = u => !!u && ownerNames().has(String(u).toLowerCase());
const ts = t => +new Date(t || 0) || 0;
function threadsOf(p) {
  const cs = p.comments || [], out = [], byCid = new Map(), base = pid(p);
  let cur = null;
  cs.forEach((c, i) => {
    const par = c.reply && c.parent ? byCid.get(c.parent) : null;
    if (c.reply && (par || cur)) { (par || cur).replies.push(c); return; }
    cur = {id: base + "#" + (c.id || i), post: p, root: c, replies: []};
    if (c.id) byCid.set(c.id, cur);
    out.push(cur);
  });
  out.forEach(t => {
    t.mine = isOwner(t.root.user);
    t.done = t.replies.some(r => isOwner(r.user));
    t.last = Math.max(ts(t.root.time), ...t.replies.map(r => ts(r.time)));
  });
  return out;
}
let thMap = new Map(), cf = store.get("cf", "all"), cShown = 100, openTh = null;

  let g = "";
  for (let k = k0; k <= k1; k++) {
    const v = k * step, lab = (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toLocaleString("ko-KR", {minimumFractionDigits: k ? sd : 0, maximumFractionDigits: sd});
    g += `<line class="${k === 0 ? "zl" : "gl"}" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${lab}</text>`;
  }
  // x축 라벨: KST 시계 기준 눈금, 화면 폭에 맞춰 간격 조절
  const long = win >= 24, labW = long ? 34 : 44, maxLab = Math.max(2, Math.floor(pw / labW));
  const steps = (long ? [1, 2, 3, 4, 6, 12, 24] : [0.25, 0.5, 1, 2, 3, 6]).map(h => h * 36e5);
  const every = steps.find(s => span / s <= maxLab) || steps[steps.length - 1], off = 9 * 36e5;
  for (let ts = Math.ceil((t0 + off) / every) * every - off; ts <= t1; ts += every)
    g += `<text class="ax" x="${X(ts).toFixed(1)}" y="${H - 6}" text-anchor="middle">${long ? kst(ts).h + "시" : hhmm(ts)}</text>`;
  // 선: 공백(15분 초과) 지점에서 끊음
  const line = pts.map(p => `${p.brk ? "M" : "L"}${X(p.ts).toFixed(1)},${Y(p.d).toFixed(1)}`).join("");
  const dense = pts.length > 80; let lastNote = -Infinity;
  let dots = "", hits = "";
  pts.forEach((p, i) => {
    const x = X(p.ts), xl = i ? (x + X(pts[i - 1].ts)) / 2 : L, xr = i < pts.length - 1 ? (x + X(pts[i + 1].ts)) / 2 : W - R;
    if (c.notes && (p.np > 0 || p.cov)) {
      dots += `<circle class="pt note" cx="${x.toFixed(1)}" cy="${Y(p.d).toFixed(1)}" r="3.5"/>`;
      g += `<line class="gl" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${TP + 12}" y2="${TP + ph}" stroke-dasharray="2 3"/>`;
      if (x - lastNote > 30) { lastNote = x; g += `<text class="nt" x="${x.toFixed(1)}" y="${TP + 8}" text-anchor="middle">${p.np > 0 ? "새 글" : "수집"}</text>`; }
    }
    if (p.gap) dots += `<circle class="pt gap" cx="${x.toFixed(1)}" cy="${Y(p.d).toFixed(1)}" r="4"/>`;
    else if (!dense || p.brk || (i + 1 < pts.length && pts[i + 1].brk)) dots += `<circle class="pt" cx="${x.toFixed(1)}" cy="${Y(p.d).toFixed(1)}" r="${dense ? 2 : 2.5}"/>`;
    hits += `<rect class="hit" data-pi="${i}" x="${xl.toFixed(1)}" y="${TP}" width="${Math.max(1, xr - xl).toFixed(1)}" height="${ph}"/>`;
  });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="최근 ${win}시간 ${c.title}">${g}<line class="vl" x1="0" x2="0" y1="${TP}" y2="${TP + ph}" style="display:none"/><path class="ln" d="${line}"/>${dots}<circle class="sel" r="4.5" style="display:none"/>${hits}</svg><div class="ctip" style="display:none"></div>`;
  box._geo = {X, Y, W};
  const si = pts.findIndex(p => p.t === chartSel[c.id]);
  if (si >= 0) selPoint(box, si); else delete chartSel[c.id];
}
function selPoint(box, i) {
  const p = box && box._pts && box._pts[i];
  if (!p || !box._geo) return;
  chartSel[box.id] = p.t;
  const {X, Y, W} = box._geo, x = X(p.ts);
  const vl = box.querySelector(".vl"); vl.setAttribute("x1", x); vl.setAttribute("x2", x); vl.style.display = "";
  const dot = box.querySelector(".sel"); dot.setAttribute("cx", x); dot.setAttribute("cy", Y(p.d)); dot.classList.toggle("gap", p.gap); dot.style.display = "";
  const tip = box.querySelector(".ctip");
  tip.innerHTML = `${fullT(p.ts)}${p.gap ? ` <small>(${num(p.gapMin)}분 공백 후)</small>` : ""}<br>증감 <b class="${p.d > 0 ? "up" : p.d < 0 ? "dn" : "zz"}">${sgn(p.d, box._c.dec)}</b>${p.gap ? ` <small>공백 동안 합계</small>` : ""}<br><small>${box._c.abs(p.v)}</small>` +
    (box._c.notes && p.np > 0 ? `<br><small>새 게시물 ${num(p.np)}개 추가 — 반응 0에서 시작해 평균이 내려갈 수 있어요</small>` : "") +
    (box._c.notes && p.cov ? `<br><small>인사이트 수집 게시물 ${num(p.cov[0])}→${num(p.cov[1])}개 — 공유·저장 평균이 바뀌어 평균이 움직일 수 있어요</small>` : "");
  tip.style.display = "block";
  const scale = box.querySelector("svg").getBoundingClientRect().width / W || 1, px = x * scale, tw = tip.offsetWidth;
  tip.style.left = Math.min(Math.max(0, px - tw / 2), box.clientWidth - tw) + "px";
}
function clearPoint(box) {
  if (!box) return;
  delete chartSel[box.id];
  box.querySelectorAll(".vl,.sel,.ctip").forEach(el => { el.style.display = "none"; });
}
const clearAll = () => document.querySelectorAll(".fchart").forEach(clearPoint);
document.addEventListener("mouseover", e => { const h = e.target.closest && e.target.closest(".fchart [data-pi]"); if (h) selPoint(h.closest(".fchart"), +h.dataset.pi); });
document.addEventListener("mouseout", e => {
  const s = e.target.closest && e.target.closest(".fchart svg");
  if (s && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("svg") === s)) clearPoint(s.closest(".fchart"));
});
let rsz; window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (tab === "instagram") drawCharts(); }, 150); });

document.addEventListener("click", e => {
  const hp = e.target.closest(".fchart [data-pi]");
  if (hp) { selPoint(hp.closest(".fchart"), +hp.dataset.pi); return; }
  if (!e.target.closest(".fchart")) clearAll();
  const wb = e.target.closest("button[data-w]");
  if (wb) { win = +wb.dataset.w; store.set("win", win); document.querySelectorAll("button[data-w]").forEach(x => x.classList.toggle("on", x === wb)); drawCharts(); return; }
  const st = e.target.closest(".has-tip");
  document.querySelectorAll(".has-tip.show").forEach(x => { if (x !== st) x.classList.remove("show"); });
  if (st) { st.classList.toggle("show"); return; }
  if (e.target.closest("[data-cmx]") || e.target.id === "cm") { closeTh(); return; }
  const cb = e.target.closest("button[data-cf]");
  if (cb) { cf = cb.dataset.cf; cShown = 100; store.set("cf", cf); thList(); return; }
  if (e.target.closest("button[data-cmore]")) { cShown += 100; thList(); return; }
  const th = e.target.closest("[data-th]");
  if (th) { showTh(th.dataset.th); return; }
  if (e.target.closest("button[data-more]")) { shown += PAGE; renderList(); return; }
  const b = e.target.closest("button[data-k],button[data-s]");
  if (!b) return;
  if (b.dataset.k) { tab = b.dataset.k; store.set("tab", tab); }
  else if (b.dataset.s !== sub) { sub = b.dataset.s; shown = PAGE; store.set("sub", sub); }
  render();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && openTh) { closeTh(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-th]")) { e.preventDefault(); showTh(e.target.dataset.th); }
});
document.addEventListener("input", e => {
  if (e.target.id !== "igq") return;
  q = e.target.value; shown = PAGE; renderList();
});
document.addEventListener("change", e => {
  if (e.target.id !== "igsort") return;
  sort = e.target.value; shown = PAGE; store.set("sort", sort); renderList();
});
// 댓글 펼침 상태 기억 + 펼칠 때만 댓글 렌더 (toggle은 버블링되지 않아 capture 사용)
document.addEventListener("toggle", e => {
  const dt = e.target;
  if (!(dt instanceof HTMLDetailsElement) || !dt.dataset.id) return;
  const id = dt.dataset.id;
  if (dt.open) {
    openC.add(id);
    const box = dt.querySelector(".clist"), p = byId.get(id);
    if (box && p && !box.innerHTML) box.innerHTML = cmtHTML(p);
  } else openC.delete(id);
}, true);

const load = () => fetch("data.json?" + Date.now()).then(r => r.json()).then(j => {
  data = j;
  document.getElementById("updated").textContent = "업데이트: " + new Date(j.updated).toLocaleString("ko-KR");
  document.getElementById("errors").innerHTML = !(j.errors && j.errors.length) ? "" : `<div class="warn">일부 데이터를 가져오지 못했습니다<ul>${j.errors.map(e => `<li>${esc(e)}</li>`).join("")}</ul></div>`;
  // 새로고침 시 열린 댓글창 스크롤 위치 보존
  const scr = {}; document.querySelectorAll("details[data-id][open] .clist").forEach(el => { scr[el.parentNode.dataset.id] = el.scrollTop; });
  render();
  document.querySelectorAll("details[data-id][open] .clist").forEach(el => { const s = scr[el.parentNode.dataset.id]; if (s) el.scrollTop = s; });
}).catch(() => { document.getElementById("view").innerHTML = `<div class="card empty">data.json을 불러오지 못했습니다.</div>`; });
load();
setInterval(load, 60000);  // 1분마다 새 데이터 확인
</script>
