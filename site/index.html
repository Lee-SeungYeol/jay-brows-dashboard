<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jay Brows 대시보드</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e3de;--ig:#d62976;--fb:#1877f2;--warn:#b45309;--warnbg:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--text:#f2f2f2;--muted:#9a9a9f;--line:#2e2e2e;--warn:#fbbf24;--warnbg:#3a2e10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h1{font-size:22px;margin:0}
.muted{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:8px;margin:18px 0}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
h2{font-size:17px;margin:28px 0 10px}
.warn{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:12px 14px;margin-top:16px;font-size:14px}
.warn ul{margin:6px 0 0;padding-left:18px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px}
.bars div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.post{display:flex;flex-direction:column;overflow:hidden;padding:0}
.post img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--line)}
.post .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.post p{margin:0;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nums{display:flex;gap:12px;font-size:13px;color:var(--muted)}
.post a{color:var(--accent);font-size:13px;text-decoration:none}
details{font-size:13px}
summary{cursor:pointer;color:var(--muted)}
.cmt{border-top:1px solid var(--line);padding:6px 0}
.cmt b{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
td.u{font-weight:600;white-space:nowrap}
td.t{color:var(--muted);white-space:nowrap;font-size:12px}
.empty{color:var(--muted);padding:30px;text-align:center}
</style>
</head>
<body>
<main>
  <header>
    <h1>Jay Brows 대시보드</h1>
    <span class="muted" id="updated"></span>
  </header>
  <div class="tabs">
    <button data-k="instagram" class="on">인스타그램</button>
    <button data-k="facebook">페이스북</button>
  </div>
  <div id="errors"></div>
  <div id="view"></div>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => n == null ? "–" : Number(n).toLocaleString("ko-KR");
const when = t => t ? new Date(t).toLocaleString("ko-KR", {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "";
let data, tab = "instagram";

function stat(label, v) { return `<div class="card stat"><b>${num(v)}</b><span>${label}</span></div>`; }

function render() {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.k === tab));
  document.documentElement.style.setProperty("--accent", tab === "instagram" ? "var(--ig)" : "var(--fb)");
  const d = data[tab], v = document.getElementById("view");
  if (!d) { v.innerHTML = `<div class="card empty">아직 데이터가 없습니다. 토큰 연결 후 표시됩니다.</div>`; return; }
  const posts = d.posts || [];
  const likes = posts.reduce((a, p) => a + (p.likes || 0), 0);
  const cmts = posts.reduce((a, p) => a + (p.comments_count || 0), 0);
  let h = `<div class="grid">` +
    (tab === "instagram"
      ? stat("팔로워", d.followers) + stat("팔로잉", d.follows) + stat("게시물", d.media_count)
      : stat("팔로워", d.followers) + stat("페이지 좋아요", d.fans)) +
    stat(`최근 ${posts.length}개 좋아요`, likes) + stat(`최근 ${posts.length}개 댓글`, cmts) +
    stat("게시물당 평균 반응", posts.length ? Math.round((likes + cmts) / posts.length) : null) +
    `</div>`;

  if (d.daily_reach && d.daily_reach.length) {
    const max = Math.max(...d.daily_reach.map(r => r.value), 1);
    h += `<h2>일별 도달</h2><div class="card"><div class="bars">` +
      d.daily_reach.map(r => `<div title="${r.date}: ${num(r.value)}" style="height:${r.value / max * 100}%"></div>`).join("") +
      `</div></div>`;
  }

  const all = posts.flatMap(p => (p.comments || []).map(c => ({...c, post: p})))
    .sort((a, b) => new Date(b.time) - new Date(a.time)).slice(0, 50);
  h += `<h2>최근 댓글 (${all.length})</h2><div class="card">` + (all.length
    ? `<table>${all.map(c => `<tr><td class="u">${esc(c.user)}</td><td>${esc(c.text)}</td><td class="t"><a href="${esc(c.post.url)}" target="_blank" rel="noopener">${when(c.time)}</a></td></tr>`).join("")}</table>`
    : `<div class="empty">댓글이 없습니다.</div>`) + `</div>`;

  h += `<h2>게시물</h2><div class="posts">` + posts.map(p => `
    <div class="card post">
      ${p.image ? `<img loading="lazy" src="${esc(p.image)}" alt="">` : ""}
      <div class="body">
        <span class="muted">${when(p.time)}</span>
        <p>${esc(p.text) || "<span class='muted'>(내용 없음)</span>"}</p>
        <div class="nums"><span>♥ ${num(p.likes)}</span><span>💬 ${num(p.comments_count)}</span>${p.shares != null ? `<span>↗ ${num(p.shares)}</span>` : ""}</div>
        ${(p.comments || []).length ? `<details><summary>댓글 보기</summary>${p.comments.map(c => `<div class="cmt"><b>${esc(c.user)}</b> ${esc(c.text)}</div>`).join("")}</details>` : ""}
        <a href="${esc(p.url)}" target="_blank" rel="noopener">원문 보기 →</a>
      </div>
    </div>`).join("") + `</div>`;
  v.innerHTML = h;
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.k; render(); });

fetch("data.json?" + Date.now()).then(r => r.json()).then(j => {
  data = j;
  document.getElementById("updated").textContent = "업데이트: " + new Date(j.updated).toLocaleString("ko-KR");
  if (j.errors && j.errors.length)
    document.getElementById("errors").innerHTML = `<div class="warn">일부 데이터를 가져오지 못했습니다<ul>${j.errors.map(e => `<li>${esc(e)}</li>`).join("")}</ul></div>`;
  render();
}).catch(() => { document.getElementById("view").innerHTML = `<div class="card empty">data.json을 불러오지 못했습니다.</div>`; });
</script>
</body>
</html>
