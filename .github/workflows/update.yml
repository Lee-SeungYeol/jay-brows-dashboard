name: Update dashboard

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub 최소 간격)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Load history (data branch)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Meta data
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          PAGE_ID: ${{ vars.PAGE_ID }}
        run: python fetch.py
      - name: Save history (data branch)
        run: |
          mkdir -p store site/raw && cp store/*.json site/raw/ 2>/dev/null || true
          cd store
          if [ ! -d .git ]; then
            git init -q -b data
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          fi
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "data $(date -u +%FT%TZ)" || exit 0
          git push -q origin HEAD:data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub's cron is unreliable (often skipped or delayed), so each run queues the next one.
      # Cron above stays as a backup in case the chain ever breaks.
      - name: Queue next run
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Start the next run 3 minutes after this one started.
          started=$(date -d "${{ github.run_started_at }}" +%s)
          wait=$(( 180 - ($(date +%s) - started) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          # Only one chain: skip if another run is already queued or running.
          busy=$(gh run list -R "${{ github.repository }}" --workflow update.yml --json status,databaseId \
            -q '[.[] | select((.status=="queued" or .status=="in_progress" or .status=="waiting") and .databaseId != ${{ github.run_id }})] | length')
          if [ "$busy" = "0" ]; then gh workflow run update.yml --ref main -R "${{ github.repository }}"; fi
